<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTQB CBT · 커밋 기록 대시보드</title>
<style>
  :root {
    --bg: #f6f8fa; --card: #ffffff; --text: #1f2328; --muted: #656d76;
    --border: #d0d7de; --accent: #0969da; --grid: #eaeef2;
    --feat: #1a7f37; --fix: #cf222e; --docs: #0969da; --refactor: #8250df;
    --chore: #9a6700; --other: #656d76;
    --shadow: 0 1px 3px rgba(27,31,36,.08), 0 1px 2px rgba(27,31,36,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --border: #30363d; --accent: #58a6ff; --grid: #21262d;
      --feat: #3fb950; --fix: #f85149; --docs: #58a6ff; --refactor: #a371f7;
      --chore: #d29922; --other: #8b949e;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0 0 28px; font-size: .9rem; }
  header a { color: var(--accent); text-decoration: none; }
  header a:hover { text-decoration: underline; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; box-shadow: var(--shadow); }
  .card .label { color: var(--muted); font-size: .8rem; margin-bottom: 6px; }
  .card .value { font-size: 1.8rem; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: .78rem; margin-top: 2px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
  .panel h2 { font-size: 1.05rem; margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .bar-label { font-size: 10px; fill: var(--muted); }
  .bar-val { font-size: 10px; fill: var(--muted); font-weight: 600; }
  .axis { stroke: var(--grid); stroke-width: 1; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 14px; font-size: .82rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .hbar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: .85rem; }
  .hbar-name { width: 92px; flex-shrink: 0; color: var(--muted); }
  .hbar-track { flex: 1; background: var(--grid); border-radius: 6px; height: 20px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 6px; }
  .hbar-num { width: 34px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .timeline { list-style: none; margin: 0; padding: 0; max-height: 460px; overflow-y: auto; }
  .timeline li { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
  .timeline li:last-child { border-bottom: none; }
  .tl-tag { flex-shrink: 0; font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #fff; min-width: 58px; text-align: center; text-transform: uppercase; letter-spacing: .3px; }
  .tl-date { flex-shrink: 0; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; width: 78px; }
  .tl-hash { flex-shrink: 0; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .76rem; color: var(--accent); width: 58px; }
  .tl-hash a { color: var(--accent); text-decoration: none; }
  .tl-hash a:hover { text-decoration: underline; }
  .tl-msg { flex: 1; font-size: .85rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filters button { font: inherit; font-size: .8rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  footer { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 32px; }
  .section-title { font-size: 1.25rem; margin: 38px 0 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .section-title:first-of-type { margin-top: 8px; }
  .lbl-chip { display: inline-block; font-size: .68rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .state-pill { flex-shrink: 0; font-size: .68rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: #fff; min-width: 54px; text-align: center; }
  .st-open { background: var(--feat); }
  .st-closed { background: var(--refactor); }
</style>
</head>

// ── 카테고리 분류 ────────────────────────────────────────────────
const CAT_COLORS = { feat:"var(--feat)", fix:"var(--fix)", docs:"var(--docs)", refactor:"var(--refactor)", chore:"var(--chore)", other:"var(--other)" };
const CAT_LABELS = { feat:"기능 (feat)", fix:"수정 (fix)", docs:"문서 (docs)", refactor:"리팩터 (refactor)", chore:"기타작업 (chore)", other:"기타 (other)" };

function classify(s) {
  const t = s.toLowerCase();
  if (/^feat|^add |^enable |^start |^use |^render |^implement|^prepare /.test(t)) return "feat";
  if (/^fix|\bfix\b|corrupt|restore|resolve|stabilize|normalize|polish/.test(t)) return "fix";
  if (/^docs|^update .*(log|report|readme|md)|^merge /.test(t)) return "docs";
  if (/^refactor|clean up|^improve /.test(t)) return "refactor";
  if (/^chore|^rename |^reduce /.test(t)) return "chore";
  return "other";
}
COMMITS.forEach(c => c.cat = classify(c.subject));

// ── 통계 카드 ────────────────────────────────────────────────────
const dates = COMMITS.map(c => c.date).sort();
const activeDays = new Set(COMMITS.map(c => c.date)).size;
const authors = [...new Set(COMMITS.map(c => c.author))];
const cardsData = [
  { label:"전체 커밋", value: COMMITS.length, sub: dates[0] + " ~ " + dates[dates.length-1] },
  { label:"활동일 수", value: activeDays, sub: "약 6주간" },
  { label:"기여자", value: authors.length, sub: authors.join(", ") },
  { label:"최다 작업일", value: "15", sub: "2026-06-08" }
];
document.getElementById("cards").innerHTML = cardsData.map(c =>
  `<div class="card"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub">${c.sub}</div></div>`
).join("");

// ── 일별 커밋 막대그래프 (SVG) ──────────────────────────────────
(function(){
  const byDate = {};
  COMMITS.forEach(c => byDate[c.date] = (byDate[c.date]||0) + 1);
  const days = Object.keys(byDate).sort();
  const max = Math.max(...Object.values(byDate));
  const W = 1000, H = 240, padL = 28, padB = 56, padT = 10;
  const bw = (W - padL) / days.length;
  const chartH = H - padB - padT;
  let bars = "";
  days.forEach((d, i) => {
    const v = byDate[d];
    const h = (v / max) * chartH;
    const x = padL + i * bw;
    const y = padT + chartH - h;
    bars += `<rect x="${x+2}" y="${y}" width="${bw-4}" height="${h}" rx="3" fill="var(--accent)"><title>${d}: ${v} commits</title></rect>`;
    bars += `<text class="bar-val" x="${x+bw/2}" y="${y-4}" text-anchor="middle">${v}</text>`;
    const md = d.slice(5);
    bars += `<text class="bar-label" x="${x+bw/2}" y="${H-padB+16}" text-anchor="middle" transform="rotate(45 ${x+bw/2} ${H-padB+16})">${md}</text>`;
  });
  document.getElementById("daily").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
       <line class="axis" x1="${padL}" y1="${padT+chartH}" x2="${W}" y2="${padT+chartH}"/>${bars}</svg>`;
})();

// ── 카테고리 분포 (도넛) ────────────────────────────────────────
(function(){
  const counts = {};
  COMMITS.forEach(c => counts[c.cat] = (counts[c.cat]||0) + 1);
  const order = ["fix","feat","docs","refactor","chore","other"].filter(k => counts[k]);
  const total = COMMITS.length;
  const cx = 130, cy = 130, r = 100, sw = 38;
  const circ = 2 * Math.PI * r;
  let offset = 0, segs = "";
  order.forEach(k => {
    const frac = counts[k] / total;
    const len = frac * circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CAT_COLORS[k]}" stroke-width="${sw}"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})">
      <title>${CAT_LABELS[k]}: ${counts[k]} (${Math.round(frac*100)}%)</title></circle>`;
    offset += len;
  });
  document.getElementById("category").innerHTML =
    `<svg viewBox="0 0 260 260" style="max-width:260px;margin:0 auto;">${segs}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-size:30px;font-weight:700;fill:var(--text)">${total}</text>
      <text x="${cx}" y="${cy+18}" text-anchor="middle" style="font-size:12px;fill:var(--muted)">commits</text></svg>`;
  document.getElementById("catLegend").innerHTML = order.map(k =>
    `<span><i class="dot" style="background:${CAT_COLORS[k]}"></i>${CAT_LABELS[k]} · ${counts[k]}</span>`
  ).join("");
})();

// ── 기여자별 (수평 막대) ────────────────────────────────────────
(function(){
  const counts = {};
  COMMITS.forEach(c => counts[c.author] = (counts[c.author]||0) + 1);
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = entries[0][1];
  const palette = ["var(--accent)","var(--feat)","var(--refactor)","var(--chore)"];
  document.getElementById("authors").innerHTML = entries.map(([name,n],i) =>
    `<div class="hbar-row">
       <span class="hbar-name" title="${name}">${name}</span>
       <span class="hbar-track"><span class="hbar-fill" style="width:${(n/max)*100}%;background:${palette[i%palette.length]}"></span></span>
       <span class="hbar-num">${n}</span>
     </div>`
  ).join("");
})();

// ── 타임라인 + 필터 ─────────────────────────────────────────────
(function(){
  const cats = ["all","fix","feat","docs","refactor","chore","other"];
  const labelOf = c => c==="all" ? "전체" : CAT_LABELS[c].split(" ")[0];
  const filters = document.getElementById("filters");
  const tl = document.getElementById("timeline");
  function render(filter){
    const items = COMMITS.filter(c => filter==="all" || c.cat===filter);
    tl.innerHTML = items.map(c =>
      `<li>
         <span class="tl-tag" style="background:${CAT_COLORS[c.cat]}">${c.cat}</span>
         <span class="tl-date">${c.date.slice(5)}</span>
         <span class="tl-hash">${c.hash}</span>
         <span class="tl-msg">${c.subject.replace(/</g,"&lt;")}</span>
       </li>`
    ).join("");
  }
  filters.innerHTML = cats.map((c,i) =>
    `<button data-cat="${c}" class="${i===0?'active':''}">${labelOf(c)}</button>`
  ).join("");
  filters.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    [...filters.children].forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    render(e.target.dataset.cat);
  });
  render("all");
})();

const REPO = "https://github.com/WindowHyun/ISTQB/issues/";
const LBL_COLORS = { bug:"#d73a4a", enhancement:"#a371f7", documentation:"#0969da", "data-issue":"#9a6700", "(없음)":"var(--muted)" };

// 이슈 통계 카드
(function(){
  const open = ISSUES.filter(i => i.state==="OPEN").length;
  const closed = ISSUES.filter(i => i.state==="CLOSED").length;
  const rate = Math.round(closed / ISSUES.length * 100);
  const data = [
    { label:"전체 이슈", value: ISSUES.length, sub:"open + closed" },
    { label:"Open", value: open, sub:"미해결" },
    { label:"Closed", value: closed, sub:"해결 완료" },
    { label:"해결률", value: rate + "%", sub: closed + " / " + ISSUES.length }
  ];
  document.getElementById("issueCards").innerHTML = data.map(c =>
    `<div class="card"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub">${c.sub}</div></div>`
  ).join("");
})();

// 이슈 상태 도넛
(function(){
  const open = ISSUES.filter(i => i.state==="OPEN").length;
  const closed = ISSUES.length - open;
  const segData = [["Closed", closed, "var(--refactor)"], ["Open", open, "var(--feat)"]];
  const total = ISSUES.length, cx=130, cy=130, r=100, sw=38, circ=2*Math.PI*r;
  let offset=0, segs="";
  segData.forEach(([name,v,col]) => {
    const len = v/total*circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})">
      <title>${name}: ${v} (${Math.round(v/total*100)}%)</title></circle>`;
    offset += len;
  });
  document.getElementById("issueState").innerHTML =
    `<svg viewBox="0 0 260 260" style="max-width:260px;margin:0 auto;">${segs}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font-size:30px;font-weight:700;fill:var(--text)">${total}</text>
      <text x="${cx}" y="${cy+18}" text-anchor="middle" style="font-size:12px;fill:var(--muted)">issues</text></svg>`;
  document.getElementById("issueStateLegend").innerHTML =
    `<span><i class="dot" style="background:var(--refactor)"></i>Closed · ${closed}</span>
     <span><i class="dot" style="background:var(--feat)"></i>Open · ${open}</span>`;
})();

// 라벨별 분포 (이슈 한 건이 여러 라벨 가질 수 있음)
(function(){
  const counts = {};
  ISSUES.forEach(i => {
    const ls = i.labels.length ? i.labels : ["(없음)"];
    ls.forEach(l => counts[l] = (counts[l]||0) + 1);
  });
  const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
  const max = entries[0][1];
  document.getElementById("issueLabels").innerHTML = entries.map(([name,n]) =>
    `<div class="hbar-row">
       <span class="hbar-name" title="${name}">${name}</span>
       <span class="hbar-track"><span class="hbar-fill" style="width:${(n/max)*100}%;background:${LBL_COLORS[name]||'var(--accent)'}"></span></span>
       <span class="hbar-num">${n}</span>
     </div>`
  ).join("");
})();

// 이슈 목록 + 필터
(function(){
  const filtersEl = document.getElementById("issueFilters");
  const listEl = document.getElementById("issueList");
  const opts = [["all","전체"],["OPEN","Open"],["CLOSED","Closed"]];
  function render(f){
    const items = ISSUES.filter(i => f==="all" || i.state===f)
      .sort((a,b) => b.n - a.n);
    listEl.innerHTML = items.map(i => {
      const chips = (i.labels.length ? i.labels : ["(없음)"]).map(l =>
        `<span class="lbl-chip" style="border-color:${LBL_COLORS[l]||'var(--border)'};color:${LBL_COLORS[l]||'var(--muted)'}">${l}</span>`
      ).join(" ");
      const pill = i.state==="OPEN"
        ? `<span class="state-pill st-open">OPEN</span>`
        : `<span class="state-pill st-closed">CLOSED</span>`;
      const dateInfo = i.state==="OPEN" ? ("생성 " + i.created.slice(5)) : ("닫힘 " + (i.closed||"").slice(5));
      return `<li>
         ${pill}
         <span class="tl-date">${dateInfo}</span>
         <span class="tl-hash"><a href="${REPO}${i.n}" target="_blank" rel="noopener">#${i.n}</a></span>
         <span class="tl-msg">${i.title.replace(/</g,"&lt;")} ${chips}</span>
       </li>`;
    }).join("");
  }
  filtersEl.innerHTML = opts.map(([v,l],idx) =>
    `<button data-f="${v}" class="${idx===0?'active':''}">${l}</button>`
  ).join("");
  filtersEl.addEventListener("click", e => {
    if (e.target.tagName !== "BUTTON") return;
    [...filtersEl.children].forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    render(e.target.dataset.f);
  });
  render("all");
})();
