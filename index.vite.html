<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 상단바(.mobile-topbar)가 상태바 아래에 바로 붙으므로 그 배경(--surface)과 같은 값을
         쓴다. 종전 값(#166064)은 폐기된 틸 브랜드색이라 상태바만 초록으로 떠 보였다. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131c2b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <title>ISTQB/CSTS React 문제풀이</title>
  </head>
  <body>
    <script>
      // 프리페인트 테마/글자크기 적용 — React(useTheme)는 제품 선택 후(AppModals)에야
      // 마운트되므로, 여기서 먼저 body[data-theme]를 세팅해 게이트 화면의 라이트 플래시
      // (FOUC)와 다크 사용자 게이트 미적용을 막는다. 이후 useTheme이 이어받는다.
      (function () {
        try {
          var pref = localStorage.getItem('istqb-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.body.dataset.theme = dark ? 'dark' : 'light';
          var font = localStorage.getItem('istqb-q-font');
          if (font) document.body.dataset.qfont = font;
        } catch (e) { /* 저장소 접근 불가 환경은 기본(라이트) 유지 */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
