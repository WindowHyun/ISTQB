<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#166064" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ISTQB FL" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="ISTQB FL" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <title>ISTQB FL v4.0 샘플문제 풀이</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="sidebarBackdrop" aria-hidden="true"></div>
    <section
      id="productGate"
      class="product-gate"
      aria-labelledby="productGateTitle"
    >
      <div class="product-gate-inner">
        <p class="product-eyebrow">Practice App</p>
        <h1 id="productGateTitle">학습할 자격증을 선택하세요</h1>
        <div class="product-actions">
          <button id="openIstqbBtn" class="product-button primary" type="button">
            ISTQB
          </button>
          <button id="openCstsBtn" class="product-button" type="button">
            CSTS
          </button>
        </div>
      </div>
    </section>

    <section
      id="cstsPage"
      class="csts-page is-product-hidden"
      aria-labelledby="cstsTitle"
      hidden
    >
      <div class="csts-shell">
        <header class="csts-header">
          <div>
            <p class="product-eyebrow">CSTS</p>
            <h1 id="cstsTitle">CSTS 문제풀이</h1>
          </div>
          <button id="cstsBackBtn" class="subtle" type="button">
            처음으로
          </button>
        </header>
        <section class="csts-browser" aria-label="CSTS 추출 문제 미리보기">
          <div class="csts-controls">
            <label for="cstsSetSelect">문제 세트</label>
            <select id="cstsSetSelect"></select>
          </div>
          <div id="cstsSummary" class="csts-summary" aria-live="polite"></div>
          <article class="question-card csts-question-card">
            <div class="question-meta" id="cstsQuestionMeta"></div>
            <h2 id="cstsQuestionTitle">CSTS 문제</h2>
            <div id="cstsQuestionStem" class="stem"></div>
            <div id="cstsQuestionFigure" class="figure-wrap"></div>
            <div id="cstsOptions" class="options"></div>
            <div id="cstsAnswer" class="feedback" aria-live="polite"></div>
          </article>
          <div class="csts-actions">
            <button id="cstsPrevBtn" class="secondary" type="button">이전</button>
            <button id="cstsNextBtn" class="primary" type="button">다음</button>
          </div>
        </section>
      </div>
    </section>

    <main class="app-shell is-product-hidden" aria-label="ISTQB 문제풀이 앱">
      <aside class="sidebar" aria-label="시험 설정">
        <div class="brand">
          <img
            src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22Quiz%20mark%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23166064%22/%3E%0A%20%20%3Cpath%20d%3D%22M18%2018h28v28H18z%22%20fill%3D%22%23f5f7f2%22/%3E%0A%20%20%3Cpath%20d%3D%22M24%2030l5%205%2011-13%22%20fill%3D%22none%22%20stroke%3D%22%23b55c3c%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%0A%20%20%3Cpath%20d%3D%22M22%2047h25%22%20stroke%3D%22%23f5f7f2%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%0A%3C/svg%3E%0A"
            alt=""
          />
          <div>
            <p id="productSubtitle">ISTQB FL v4.0</p>
            <h1 id="productTitle">샘플문제 풀이</h1>
          </div>
        </div>

        <div class="mobile-sidebar-summary">
          <div>
            <strong id="mobileSetText">샘플문제 A</strong>
            <span id="mobileProgressText">연습 · 0 / 40</span>
            <div class="mobile-summary-stats">
              <span id="mobileProgressBadge">진행 0 / 40</span>
              <span id="mobileTimerBadge">시간 00:00</span>
            </div>
          </div>
          <button
            id="sidebarToggleBtn"
            type="button"
            aria-label="설정 펼치기"
            aria-controls="sidebarControls"
            title="설정 펼치기"
            aria-expanded="false"
          >
            ⚙
          </button>
        </div>

        <section
          id="gradeActionSection"
          class="action-section quick-grade-section"
        >
          <div class="actions">
            <button id="gradeBtn" class="primary" type="button">
              채점하기
            </button>
          </div>
          <p id="actionHint" class="action-hint" aria-live="polite"></p>
        </section>

        <div id="sidebarControls" class="sidebar-controls">
          <section class="panel">
            <label for="examSelect">문제 세트</label>
            <select id="examSelect"></select>
          </section>

          <section class="panel">
            <label>풀이 모드</label>
            <div class="segmented" role="group" aria-label="풀이 모드">
              <button class="active" type="button" data-mode="practice">
                연습
              </button>
              <button type="button" data-mode="exam">시험</button>
              <button type="button" data-mode="random">랜덤</button>
              <button type="button" data-mode="review">오답</button>
            </div>
          </section>

          <section class="stats" aria-live="polite">
            <div>
              <span>진행</span>
              <strong id="progressText">0 / 40</strong>
            </div>
            <div>
              <span>시간</span>
              <strong id="timerText">00:00</strong>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </section>

          <section class="action-section">
            <h3>오답 관리</h3>
            <div class="actions">
              <button id="retryWrongBtn" type="button">오답 다시 풀기</button>
              <button id="wrongNoteBtn" class="subtle" type="button">
                오답 노트
              </button>
            </div>
          </section>

          <section class="settings-section">
            <button
              id="settingsPanelToggleBtn"
              class="settings-toggle"
              type="button"
              aria-label="설정"
              aria-expanded="false"
              aria-controls="settingsPanel"
            >
              설정
            </button>
            <div id="settingsPanel" class="settings-content" hidden>
              <section class="action-section app-navigation-section">
                <h3>앱 이동</h3>
                <div class="record-actions">
                  <button
                    id="productHomeBtn"
                    class="subtle text-action"
                    type="button"
                    aria-label="처음 화면으로 이동"
                  >
                    처음
                  </button>
                </div>
              </section>

              <section class="panel">
                <label>글자 크기</label>
                <div
                  class="segmented compact"
                  role="group"
                  aria-label="문제 글자 크기"
                >
                  <button type="button" data-font-size="small">작게</button>
                  <button class="active" type="button" data-font-size="normal">
                    기본
                  </button>
                  <button type="button" data-font-size="large">크게</button>
                </div>
              </section>

              <section class="action-section record-section">
                <h3>기록 관리</h3>
                <div class="record-actions">
                  <button id="exportBackupBtn" type="button">기록 내보내기</button>
                  <button id="importBackupBtn" type="button">기록 가져오기</button>
                </div>
                <p id="backupStatus" class="backup-status" aria-live="polite">
                  내보내기 후 파일명과 확인 위치가 여기에 표시됩니다.
                </p>
                <input
                  id="backupFileInput"
                  type="file"
                  accept="application/json,.json"
                  hidden
                />
              </section>

              <section class="action-section log-section">
                <h3>진단</h3>
                <div class="record-actions">
                  <button id="consoleLogBtn" type="button">Console 확인</button>
                </div>
                <p class="backup-status">
                  에러 발생 시 최근 로그를 확인하거나 복사/저장할 수 있습니다.
                </p>
              </section>

              <section class="action-section">
                <h3>초기화</h3>
                <div class="danger-actions">
                  <button id="resetBtn" class="danger" type="button">
                    현재 모드 풀이 초기화
                  </button>
                  <button id="resetAllBtn" class="danger" type="button">
                    현재 세트 기록 전체 삭제
                  </button>
                </div>
              </section>
            </div>
          </section>
        </div>
      </aside>

      <section class="workspace" aria-label="문제 풀이 영역">
        <header class="topbar">
          <div>
            <p id="setMeta">샘플문제 A</p>
            <h2 id="questionTitle">문제 1</h2>
          </div>
          <div class="topbar-actions">
            <button id="prevBtn" type="button" aria-label="이전 문제">‹</button>
            <button id="nextBtn" type="button" aria-label="다음 문제">›</button>
          </div>
        </header>

        <article class="question-card">
          <div
            id="appStatus"
            class="app-status skeleton-card"
            role="status"
            aria-live="polite"
          >
            <span class="skeleton-line"></span>
            <span class="skeleton-line short"></span>
          </div>
          <div id="questionStem" class="question-stem"></div>
          <div id="questionFigure" class="question-figure" hidden></div>
          <div id="options" class="options"></div>
          <div id="feedback" class="feedback" hidden></div>
        </article>

        <p id="navSummary" class="nav-summary" hidden></p>
        <button
          id="toggleNavBtn"
          class="question-nav-toggle"
          type="button"
          aria-expanded="true"
        >
          문제 번호 접기
        </button>
        <nav id="questionNav" class="question-nav" aria-label="문제 번호"></nav>
      </section>
    </main>

    <div id="figureModal" class="modal-backdrop" hidden>
      <section
        class="modal-panel figure-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="figureModalTitle"
      >
        <header class="modal-header">
          <h3 id="figureModalTitle">그림 확대</h3>
          <button id="figureModalCloseBtn" type="button">닫기</button>
        </header>
        <div id="figureModalBody" class="modal-body"></div>
      </section>
    </div>

    <div id="wrongNoteModal" class="modal-backdrop" hidden>
      <section
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="wrongNoteTitle"
      >
        <header class="modal-header">
          <h3 id="wrongNoteTitle">오답 노트</h3>
          <button id="clearWrongNoteBtn" class="danger subtle" type="button" style="margin-right:8px; padding:4px 8px; font-size:13px;">비우기</button>
            <button id="wrongNoteCloseBtn" type="button">닫기</button>
        </header>
        <div id="wrongNoteBody" class="modal-body"></div>
      </section>
    </div>

    <div id="backupImportModal" class="modal-backdrop" hidden>
      <section
        class="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="backupImportTitle"
      >
        <header class="modal-header">
          <h3 id="backupImportTitle">기록 가져오기</h3>
          <button id="backupImportCloseBtn" type="button">닫기</button>
        </header>
        <div id="backupImportBody" class="modal-body"></div>
      </section>
    </div>

    <div id="consoleLogModal" class="modal-backdrop" hidden>
      <section
        class="modal-panel console-log-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="consoleLogTitle"
      >
        <header class="modal-header">
          <h3 id="consoleLogTitle">Console 로그</h3>
          <button id="consoleLogCloseBtn" type="button">닫기</button>
        </header>
        <div class="modal-body console-log-body">
          <p id="consoleLogMeta" class="console-log-meta"></p>
          <pre id="consoleLogText" class="console-log-output"></pre>
          <div class="console-log-actions">
            <button id="copyConsoleLogBtn" type="button">로그 복사</button>
            <button id="exportConsoleLogBtn" type="button">
              파일로 저장/공유
            </button>
            <button id="clearConsoleLogBtn" class="danger" type="button">
              로그 비우기
            </button>
          </div>
          <p id="consoleLogStatus" class="backup-status" aria-live="polite"></p>
        </div>
      </section>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
