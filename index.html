<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#166064" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ISTQB FL" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <title>ISTQB FL v4.0 샘플문제 풀이</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f5f7f2;
  --ink: #17201c;
  --muted: #637069;
  --line: #dbe2d8;
  --panel: #ffffff;
  --accent: #166064;
  --accent-strong: #0e4548;
  --good: #168044;
  --bad: #bd3930;
  --warn: #b26b00;
  --shadow: 0 18px 45px rgba(23, 32, 28, 0.1);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(120deg, rgba(22, 96, 100, 0.08), transparent 32%),
    linear-gradient(0deg, rgba(181, 92, 60, 0.08), transparent 38%),
    var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
}

button,
select {
  font: inherit;
}

button {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 8px;
  cursor: pointer;
  min-height: 42px;
}

button:hover {
  border-color: var(--accent);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.app-shell {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  padding: 24px;
  border-right: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
}

.brand {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 28px;
}

.brand img {
  width: 54px;
  height: 54px;
}

.brand p,
.topbar p {
  margin: 0 0 3px;
  color: var(--muted);
  font-size: 13px;
}

.brand h1,
.topbar h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.25;
}

.panel {
  margin-bottom: 18px;
}

.panel label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

select {
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
}

.segmented {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #eef2eb;
}

.segmented button {
  min-height: 36px;
  border: 0;
  background: transparent;
  font-weight: 700;
}

.segmented button.active {
  background: var(--panel);
  color: var(--accent-strong);
  box-shadow: 0 6px 16px rgba(23, 32, 28, 0.08);
}

.stats {
  display: grid;
  gap: 10px;
  margin: 24px 0;
}

.stats div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}

.stats span {
  color: var(--muted);
  font-size: 13px;
}

.stats strong {
  font-size: 17px;
}

.actions {
  display: grid;
  gap: 10px;
}

.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
  font-weight: 800;
}

.workspace {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 18px;
  padding: 28px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.topbar-actions {
  display: flex;
  gap: 8px;
}

.topbar-actions button {
  width: 44px;
  font-size: 26px;
  line-height: 1;
}

.question-card {
  display: grid;
  align-content: start;
  gap: 20px;
  min-height: 430px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.question-stem {
  white-space: pre-wrap;
  font-size: 20px;
  line-height: 1.7;
  word-break: keep-all;
  overflow-x: auto;
}

.question-stem .table-block {
  display: block;
  margin: 12px 0;
  padding: 14px;
  overflow-x: auto;
  border: 1px solid #c8d7d2;
  border-radius: 8px;
  background: #f8fbfa;
  color: #102b2d;
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre;
}

.choice-token {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  min-height: 26px;
  margin: 0 3px;
  padding: 1px 7px;
  border: 1px solid #b8cbc5;
  border-radius: 7px;
  background: #eef7f4;
  color: var(--accent-strong);
  font-weight: 800;
  line-height: 1.35;
}

.options {
  display: grid;
  gap: 12px;
}

.option {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  width: 100%;
  min-height: 58px;
  padding: 13px 14px;
  text-align: left;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.option-text {
  line-height: 1.6;
}

.option-key {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #eef2eb;
  color: var(--accent-strong);
  font-weight: 800;
  text-transform: uppercase;
}

.option.selected {
  border-color: var(--accent);
  background: #edf8f6;
}

.option.correct {
  border-color: var(--good);
  background: #edf8f1;
}

.option.wrong {
  border-color: var(--bad);
  background: #fff0ee;
}

.feedback {
  padding: 18px;
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  background: #f7faf6;
  line-height: 1.65;
}

.feedback strong {
  display: block;
  margin-bottom: 6px;
}

.question-nav {
  display: grid;
  grid-template-columns: repeat(20, minmax(34px, 1fr));
  gap: 8px;
}

.question-nav button {
  min-height: 36px;
  padding: 0;
  font-weight: 800;
}

.question-nav button.current {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}

.question-nav button.answered {
  border-color: #94aaa2;
  background: #e5eee9;
}

.question-nav button.unanswered {
  border-style: dashed;
  color: var(--muted);
}

.question-nav button.correct {
  border-color: var(--good);
  background: #edf8f1;
  color: var(--good);
}

.question-nav button.missed {
  border-color: var(--bad);
  background: #fff0ee;
  color: var(--bad);
}

.question-nav.collapsed {
  display: none;
}

@media (max-width: 900px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .workspace {
    padding: 18px;
  }

  .question-card {
    padding: 20px;
  }

  .question-stem {
    font-size: 17px;
  }

  .question-nav {
    grid-template-columns: repeat(8, minmax(34px, 1fr));
  }
}

@media (max-width: 640px) {
  .actions {
    grid-template-columns: 1fr 1fr;
  }

  .actions button {
    min-height: 44px;
  }

  .primary {
    grid-column: 1 / -1;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="시험 설정">
        <div class="brand">
          <img src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22Quiz%20mark%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23166064%22/%3E%0A%20%20%3Cpath%20d%3D%22M18%2018h28v28H18z%22%20fill%3D%22%23f5f7f2%22/%3E%0A%20%20%3Cpath%20d%3D%22M24%2030l5%205%2011-13%22%20fill%3D%22none%22%20stroke%3D%22%23b55c3c%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%0A%20%20%3Cpath%20d%3D%22M22%2047h25%22%20stroke%3D%22%23f5f7f2%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%0A%3C/svg%3E%0A" alt="" />
          <div>
            <p>ISTQB FL v4.0</p>
            <h1>샘플문제 풀이</h1>
          </div>
        </div>

        <section class="panel">
          <label for="examSelect">문제 세트</label>
          <select id="examSelect"></select>
        </section>

        <section class="panel">
          <label>풀이 모드</label>
          <div class="segmented" role="group" aria-label="풀이 모드">
            <button class="active" type="button" data-mode="practice">연습</button>
            <button type="button" data-mode="exam">시험</button>
            <button type="button" data-mode="random">랜덤</button>
            <button type="button" data-mode="review">오답</button>
          </div>
        </section>

        <section class="stats" aria-live="polite">
          <div>
            <span>진행</span>
            <strong id="progressText">0 / 40</strong>
          </div>
          <div>
            <span>정답률</span>
            <strong id="scoreText">0%</strong>
          </div>
          <div>
            <span>시간</span>
            <strong id="timerText">00:00</strong>
          </div>
        </section>

        <div class="actions">
          <button id="gradeBtn" class="primary" type="button">채점하기</button>
          <button id="retryWrongBtn" type="button">오답 다시 풀기</button>
          <button id="toggleNavBtn" type="button" aria-expanded="true">문제 번호 접기</button>
          <button id="resetBtn" type="button">초기화</button>
          <button id="resetAllBtn" type="button">현재 세트 전체 초기화</button>
        </div>
      </aside>

      <section class="workspace" aria-label="문제 풀이 영역">
        <header class="topbar">
          <div>
            <p id="setMeta">샘플문제 A</p>
            <h2 id="questionTitle">문제 1</h2>
          </div>
          <div class="topbar-actions">
            <button id="prevBtn" type="button" aria-label="이전 문제">‹</button>
            <button id="nextBtn" type="button" aria-label="다음 문제">›</button>
          </div>
        </header>

        <article class="question-card">
          <div id="questionStem" class="question-stem"></div>
          <div id="options" class="options"></div>
          <div id="feedback" class="feedback" hidden></div>
        </article>

        <nav id="questionNav" class="question-nav" aria-label="문제 번호"></nav>
      </section>
    </main>

    <script>
window.ISTQB_DATA = {
  "source": "ISTQB Foundation Level v4.0 Korean sample exams",
  "sets": [
    {
      "id": "A",
      "title": "샘플문제 A",
      "questionPdf": "ISTQB_FL_v4.0_샘플문제_A_v1.7_한글_v1.0.pdf",
      "answerPdf": "ISTQB_FL_v4.0_샘플문제_A_v1.7_정답과_해설_한글_v1.0.pdf",
      "questions": [
        {
          "number": 1,
          "stem": "다음 설명 중 유효한 테스트 목적인 것은?",
          "options": [
            {
              "key": "a",
              "text": "테스트 중인 시스템에 수정되지 않은 결함이 없음을 증명하기 위해"
            },
            {
              "key": "b",
              "text": "운영 환경에 구현한 시스템에 오류가 없음을 증명하기 위해"
            },
            {
              "key": "c",
              "text": "테스트 대상의 리스크 수준을 낮추고, 품질 수준에 대한 자신감을 얻기 위해"
            },
            {
              "key": "d",
              "text": "테스트하지 않은 입력 조합이 없는지 확인하기 위해"
            }
          ],
          "answer": [
            "c"
          ],
          "explanation": "a) 정답이 아닙니다. 테스트 중인 시스템에 더 이상 결함이 없다고 증명하는 것은 불가능 합니다. 테스팅 원리 1을 참조하십시오. b) 정답이 아닙니다. 테스팅 원리 7을 참조하십시오. c) 정답입니다. 테스팅은 결함과 장애를 찾아서 리스크 수준을 줄이고 테스트 대상의 품질 수준에 대한 신뢰를 높여줍니다. d) 정답이 아닙니다. 모든 입력 조합을 테스트하는 것은 불가능합니다. (테스팅 원리 2를 참조하십시오.)"
        },
        {
          "number": 2,
          "stem": "다음 중 테스트 활동이 성공에 기여하는 예를 나타내는 옵션은?",
          "options": [
            {
              "key": "a",
              "text": "소프트웨어 개발 수명주기의 다양한 활동에 테스터가 참여함으로써 작업 산출물의 결함 식별을 지원한다"
            },
            {
              "key": "b",
              "text": "개발자가 코드를 개발하는 동안 테스터가 방해하지 않도록 애씀으로써 개발자가 더 좋은 코드를 작성할 수 있게 한다"
            },
            {
              "key": "c",
              "text": "최종 사용자와 협업하는 테스터는 단위 통합 및 시스템 테스팅 중 작성하는 결함 보고서의 품질을 높인다"
            },
            {
              "key": "d",
              "text": "자격증을 보유한 테스터가 자격증이 없는 테스터보다 훨씬 좋은 테스트 케이스를 작성할 것이다"
            }
          ],
          "answer": [
            "a"
          ],
          "explanation": "a) 정답입니다. 소프트웨어 개발 수명주기(SDLC)의 시작부터 테스터가 참여하는 것은 중요합니다. 설계 결정 사항에 대한 이해를 높이고 결함을 조기에 발견할 수 있게 해줍니다. b) 정답이 아닙니다. 개발자와 테스터 모두 서로의 작업 산출물과 코드의 테스트 방법에 대해 더 이해하게 될 것입니다. c) 정답이 아닙니다. 최종 사용자는 결함 보고서의 품질 향상을 위해 테스터를 지원하지 않으며, 또한 사용자는 일반적으로 통합 테스팅과 같은 하위 레벨 테스팅에 참여하지 않습니다. d) 정답이 아닙니다. 자격증 보유는 테스터가 테스트 설계를 더 잘한다는 것을 의미하지 않습니다. 정답"
        },
        {
          "number": 3,
          "stem": "당신은 새로운 시스템을 점진적으로 개발하고 있는 팀의 테스터이다. 여러 번의 반복주기 가 진행되는 동안 리그레션 테스트 케이스가 바뀌지 않았고, 새로운 리그레션 결함도 식별되 지 않았음을 확인했다. 팀의 관리자는 기뻐하고 있지만, 당신은 그렇지 못하다. 당신이 걱정하 고 있는 것을 설명하는 테스팅의 원리는?",
          "options": [
            {
              "key": "a",
              "text": "테스트 효과는 줄어든다"
            },
            {
              "key": "b",
              "text": "결함 부재의 논리는 궤변이다"
            },
            {
              "key": "c",
              "text": "결함은 집중된다"
            },
            {
              "key": "d",
              "text": "완벽한 테스팅은 불가능하다"
            }
          ],
          "answer": [
            "a"
          ],
          "explanation": "a) 정답입니다. 이 원리는 만약 같은 테스트를 계속해서 반복한다면, 결국엔 이 테스트로 더 이상 새로운 결함을 찾지 못한다는 것을 의미합니다. 또한 모든 테스트가 이번 릴리스에서 통과한 이유도 이것 때문일 것입니다. b) 정답이 아닙니다. 이 원리는 그저 많은 수의 결함을 발견하고 수정하는 것이 시스템의 성공을 보장한다는 잘못된 믿음에 대해 이야기합니다. c) 정답이 아닙니다. 이 원리는 보통 적은 수의 컴포넌트가 대부분의 결함을 가지고 있다는 것을 말합니다. d) 정답이 아닙니다. 이 원리는 모든 입력값과 사전 조건의 조합을 테스트하는 것은 불가능하다는 것을 말합니다."
        },
        {
          "number": 4,
          "stem": "당신은 배달 주문 모바일 애플리케이션을 개발하는 팀에서 일하고 있다. 팀은 현재 반복 주기에서 결제 기능을 구현하기로 결정했다. 다음 중 테스트 분석 활동은?",
          "options": [
            {
              "key": "a",
              "text": "결제 서비스와의 통합을 테스트하는 데 8 M/D가 소요될 것으로 예상하는 행위"
            },
            {
              "key": "b",
              "text": "한 건의 주문에 여러 명이 각자 결제를 할 수 있는지 팀이 테스트해야 한다고 결정하는 행위"
            },
            {
              "key": "c",
              "text": "경계값 분석으로 최소 결제 금액 처리를 확인하는 테스트 케이스에 필요한 테스트 데이터를 도출하는 행위"
            },
            {
              "key": "d",
              "text": "신용카드 결제를 확인하는 테스트 케이스를 실행한 후, 실제 결과와 기대 결과의 차이를 분석해서 결함을 보고하는 행위"
            }
          ],
          "answer": [

    <script>
const data = window.ISTQB_DATA;

  index: Number.isInteger(savedUiState.index) ? savedUiState.index : 0,
  examGraded: savedUiState.examGraded || {},
  randomGraded: Boolean(savedUiState.randomGraded),
  randomRefs: Array.isArray(savedUiState.randomRefs) ? savedUiState.randomRefs : [],
  reviewRetake: savedUiState.reviewRetake || {},
  reviewIds: savedUiState.reviewIds || {},
  navCollapsed: Boolean(savedUiState.navCollapsed),
  startedAt: Number.isFinite(savedUiState.startedAt) ? savedUiState.startedAt : Date.now(),
  answers: loadAnswers(),
};

let backgroundedAt = 0;

const examSelect = document.querySelector("#examSelect");
const progressText = document.querySelector("#progressText");
const scoreText = document.querySelector("#scoreText");
const timerText = document.querySelector("#timerText");
const setMeta = document.querySelector("#setMeta");
const questionTitle = document.querySelector("#questionTitle");
const questionStem = document.querySelector("#questionStem");
const options = document.querySelector("#options");
const feedback = document.querySelector("#feedback");
const questionNav = document.querySelector("#questionNav");
const gradeBtn = document.querySelector("#gradeBtn");
const retryWrongBtn = document.querySelector("#retryWrongBtn");
const toggleNavBtn = document.querySelector("#toggleNavBtn");
const resetBtn = document.querySelector("#resetBtn");
const resetAllBtn = document.querySelector("#resetAllBtn");
const prevBtn = document.querySelector("#prevBtn");
const nextBtn = document.querySelector("#nextBtn");

function currentSet() {
  return data.sets.find((set) => set.id === state.setId);
}

function validSetId(setId) {
  return data.sets.some((set) => set.id === setId) ? setId : data.sets[0].id;
}

function validMode(mode) {
  return ["practice", "exam", "random", "review"].includes(mode) ? mode : "practice";
}

function currentQuestions() {
  const questions = currentSet().questions;
  if (state.mode === "random") return randomQuestions();
  if (state.mode !== "review") return questions;
  if (!isExamGraded()) return [];
  if (isReviewRetake()) {
    const ids = state.reviewIds[state.setId] || [];
    return questions.filter((question) => ids.includes(question.number));
  }
  return questions.filter((question) => !isCorrect(question, "exam"));
}

function allQuestions() {
  return data.sets.flatMap((set) =>
    set.questions.map((question) => ({
      ...question,
      setId: set.id,
      setTitle: set.title,
    }))
  );
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
  }
  return copy;
}

function generateRandomRefs() {
  state.randomRefs = shuffle(allQuestions())
    .slice(0, 40)
    .map((question) => ({ setId: question.setId, number: question.number }));
}

function randomQuestions() {
  if (state.randomRefs.length !== 40) generateRandomRefs();
  return state.randomRefs
    .map((ref) => {
      const set = data.sets.find((item) => item.id === ref.setId);
      const question = set?.questions.find((item) => item.number === ref.number);
      return question ? { ...question, setId: set.id, setTitle: set.title } : null;
    })
    .filter(Boolean);
}

function storageKey() {
  return "istqb-fl-v4-sample-answers";
}

function uiStorageKey() {
  return "istqb-fl-v4-sample-ui-state";
}

function loadUiState() {
  try {
    return JSON.parse(localStorage.getItem(uiStorageKey())) || {};
  } catch {
    return {};
  }
}

function loadAnswers() {
  try {
    return JSON.parse(localStorage.getItem(storageKey())) || {};
  } catch {
    return {};
  }
}

function saveAnswers() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(state.answers));
  } catch {
    // Some tablet browsers block localStorage for file:// pages. Keep the in-memory answers usable.
  }
}

function saveUiState() {
  try {
    localStorage.setItem(
      uiStorageKey(),
      JSON.stringify({
        setId: state.setId,
        mode: state.mode,
        index: state.index,
        examGraded: state.examGraded,
        randomGraded: state.randomGraded,
        randomRefs: state.randomRefs,
        reviewRetake: state.reviewRetake,
        reviewIds: state.reviewIds,
        navCollapsed: state.navCollapsed,
        startedAt: state.startedAt,
      })
    );
  } catch {
    // Returning from background still works while the page remains alive.
  }
}

function answerKey(question, mode = answerMode()) {
  const setId = question.setId || state.setId;
  return `${setId}-${mode}-${question.number}`;
}

function answerMode() {
  return state.mode === "review" ? "exam" : state.mode;
}

function selectedFor(question, mode = answerMode()) {
  return state.answers[answerKey(question, mode)] || [];
}

function sameChoices(left, right) {
  return [...left].sort().join(",") === [...right].sort().join(",");
}

function isCorrect(question, mode = answerMode()) {
  return sameChoices(selectedFor(question, mode), question.answer);
}

function isExamGraded() {
  return Boolean(state.examGraded[state.setId]);
}

function setExamGraded(value) {
  state.examGraded[state.setId] = value;
}

function isRandomGraded() {
  return Boolean(state.randomGraded);
}

function setRandomGraded(value) {
  state.randomGraded = value;
}

function isReviewRetake() {
  return Boolean(state.reviewRetake[state.setId]);
}

function setReviewRetake(value) {
  state.reviewRetake[state.setId] = value;
}

function resetAnswersFor(mode) {
  const questions = mode === "random" ? randomQuestions() : currentSet().questions;
  questions.forEach((question) => delete state.answers[answerKey(question, mode)]);
}

function unansweredCount(mode = answerMode()) {
  const questions = mode === "random" ? randomQuestions() : currentSet().questions;
  return questions.filter((question) => selectedFor(question, mode).length === 0).length;
}

function missedExamQuestions() {
  return currentSet().questions.filter((question) => !isCorrect(question, "exam"));
}

function missedRandomQuestions() {
  return randomQuestions().filter((question) => !isCorrect(question, "random"));
}

function formatChoice(choices) {
  return choices.map((choice) => choice.toUpperCase()).join(", ");
}

function renderExamSelect() {
  examSelect.innerHTML = data.sets
    .map((set) => `<option value="${set.id}">${set.title}</option>`)
    .join("");
  examSelect.value = state.setId;
}

function renderMode() {
  document.querySelectorAll("[data-mode]").forEach((button) => {
    button.classList.toggle("active", button.dataset.mode === state.mode);
  });
  examSelect.disabled = state.mode === "random";
}

function renderRichText(target, text) {
  target.replaceChildren();
  const lines = String(text || "").split("\n");
  lines.forEach((line, index) => {
    if (index > 0) target.appendChild(document.createElement("br"));
    if (isTableLikeLine(line)) {
      const block = document.createElement("span");
      block.className = "table-block";
      block.textContent = line;
      target.appendChild(block);
      return;
    }
    appendHighlightedTokens(target, line);
  });
}

function isTableLikeLine(line) {
  return /\|/.test(line) || / {3,}/.test(line) || /\t/.test(line);
}

function appendHighlightedTokens(target, text) {
  const pattern = /\b(i|ii|iii|iv|v|[A-E])(?=[\s,.)/:])/g;
  let cursor = 0;
  String(text).replace(pattern, (match, _token, offset) => {
    if (offset > cursor) target.appendChild(document.createTextNode(text.slice(cursor, offset)));
    const token = document.createElement("span");
    token.className = "choice-token";
    token.textContent = match;
    target.appendChild(token);
    cursor = offset + match.length;
    return match;
  });
  if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
}

function render() {
  const set = currentSet();
  const questions = currentQuestions();
  const canGrade = state.mode === "exam" || state.mode === "random" || (state.mode === "review" && isReviewRetake());
  gradeBtn.disabled = !canGrade;
  gradeBtn.textContent = state.mode === "review" && isReviewRetake() ? "오답 재채점" : "채점하기";
  retryWrongBtn.hidden = state.mode !== "review" || !isExamGraded() || isReviewRetake() || missedExamQuestions().length === 0;
  toggleNavBtn.textContent = state.navCollapsed ? "문제 번호 펼치기" : "문제 번호 접기";
  toggleNavBtn.setAttribute("aria-expanded", String(!state.navCollapsed));
  questionNav.classList.toggle("collapsed", state.navCollapsed);
  if (questions.length === 0) {
    setMeta.textContent = state.mode === "random" ? "A-D 랜덤 40문항" : `${set.title} · ${set.questions.length}문항`;
    questionTitle.textContent = "오답 없음";
    questionStem.textContent = isExamGraded()
      ? "채점한 시험에서 틀린 문제가 없습니다."
      : "시험 모드에서 채점하면 오답만 표시됩니다.";

  if (state.index < 0) state.index = 0;

  const question = questions[state.index];
  const selected = selectedFor(question);
  const multi = question.answer.length > 1;

  setMeta.textContent = state.mode === "random" ? `${question.setTitle} · 랜덤 ${state.index + 1} / ${questions.length}` : `${set.title} · ${set.questions.length}문항`;
  questionTitle.textContent = `문제 ${question.number}${multi ? " · 복수정답" : ""}`;
  renderRichText(questionStem, question.stem);

  options.innerHTML = "";
  question.options.forEach((option) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    const isSelected = selected.includes(option.key);
    button.classList.toggle("selected", isSelected);
    if (shouldShowResults()) {
      button.classList.toggle("correct", question.answer.includes(option.key));
      button.classList.toggle("wrong", isSelected && !question.answer.includes(option.key));
    }
    const key = document.createElement("span");
    key.className = "option-key";
    key.textContent = option.key;
    const text = document.createElement("span");
    text.className = "option-text";
    renderRichText(text, option.text);
    button.draggable = false;
    button.append(key, text);
    button.addEventListener("click", () => chooseOption(question, option.key));
    options.appendChild(button);
  });

  feedback.hidden = !shouldShowFeedback(selected);
  if (!feedback.hidden) {
    const result = isCorrect(question) ? "정답" : "오답";
    feedback.replaceChildren();
    const title = document.createElement("strong");
    title.textContent = `${result} · 정답 ${formatChoice(question.answer)}`;
    const explanation = document.createElement("span");
    explanation.textContent = question.explanation;
    feedback.append(title, explanation);
  }

  renderNav(questions);
  renderStats();
}

function renderNav(questions) {
  questionNav.innerHTML = "";
  questions.forEach((question, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = state.mode === "random" ? index + 1 : question.number;
    button.classList.toggle("current", index === state.index);
    button.classList.toggle("answered", selectedFor(question).length > 0);
    button.classList.toggle("correct", shouldShowResults() && isCorrect(question));
    button.classList.toggle("missed", shouldShowResults() && !isCorrect(question));
    button.classList.toggle("unanswered", selectedFor(question).length === 0);
    button.addEventListener("click", () => {
      state.index = index;
      render();
    });
    questionNav.appendChild(button);
  });
}

function renderStats() {
  const questions = state.mode === "review" || state.mode === "random" ? currentQuestions() : currentSet().questions;
  const mode = answerMode();
  const answered = questions.filter((question) => selectedFor(question).length).length;
  progressText.textContent = `${answered} / ${questions.length}`;
  if ((state.mode === "exam" && !isExamGraded()) || (state.mode === "random" && !isRandomGraded())) {
    scoreText.textContent = "0%";
    return;
  }
  const correct = questions.filter((question) => isCorrect(question, mode)).length;
  scoreText.textContent = questions.length ? `${Math.round((correct / questions.length) * 100)}%` : "0%";
}

function shouldShowResults() {
  return (state.mode === "review" && !isReviewRetake()) || (state.mode === "exam" && isExamGraded()) || (state.mode === "random" && isRandomGraded());
}

function shouldShowFeedback(selected) {
  return (
    (state.mode === "review" && !isReviewRetake()) ||
    (state.mode === "exam" && isExamGraded()) ||
    (state.mode === "random" && isRandomGraded()) ||
    (state.mode === "practice" && selected.length > 0)
  );
}

function chooseOption(question, key) {
  const current = new Set(selectedFor(question));
  if (question.answer.length > 1) {
    current.has(key) ? current.delete(key) : current.add(key);
  } else {
    current.clear();
    current.add(key);
  }
  state.answers[answerKey(question)] = [...current];
  saveAnswers();
  saveUiState();
  render();
}

function move(delta) {
  state.index += delta;
  saveUiState();
  render();
}

function resetCurrentSet() {
  resetAnswersFor(answerMode());
  if (state.mode === "random") {
    generateRandomRefs();
    setRandomGraded(false);
  }
  if (state.mode === "exam" || state.mode === "review") setExamGraded(false);
  if (state.mode === "review") {
    setReviewRetake(false);
    state.reviewIds[state.setId] = [];
  }
  state.startedAt = Date.now();
  saveAnswers();
  saveUiState();
  render();
}

function hasModeProgress(mode = state.mode) {
  const questions = mode === "random" ? randomQuestions() : mode === "review" ? currentQuestions() : currentSet().questions;
  const answerModeForCheck = mode === "review" ? "exam" : mode;
  return questions.some((question) => selectedFor(question, answerModeForCheck).length > 0);
}

function resetModeStart(mode) {
  if (mode === "exam") {
    resetAnswersFor("exam");
    setExamGraded(false);
    setReviewRetake(false);
    state.reviewIds[state.setId] = [];
  }
  if (mode === "practice") {
    resetAnswersFor("practice");
  }
  if (mode === "random") {
    resetAnswersFor("random");
    generateRandomRefs();
    setRandomGraded(false);
  }
  state.startedAt = Date.now();
}

function updateTimer() {
  const seconds = Math.floor((Date.now() - state.startedAt) / 1000);
  const minutes = String(Math.floor(seconds / 60)).padStart(2, "0");
  const remainder = String(seconds % 60).padStart(2, "0");
  timerText.textContent = `${minutes}:${remainder}`;
}

examSelect.addEventListener("change", () => {
  state.setId = examSelect.value;
  state.index = 0;
  state.startedAt = Date.now();
  saveUiState();
  render();
});

document.querySelectorAll("[data-mode]").forEach((button) => {
  button.addEventListener("click", () => {
    const nextMode = button.dataset.mode;
    if (nextMode === state.mode) return;
    if (hasModeProgress() && !window.confirm("진행 중인 모드를 변경하면 현재 진행 상태가 초기화될 수 있습니다. 모드 변경하시겠습니까?")) return;
    resetModeStart(nextMode);
    state.mode = nextMode;
    state.index = 0;
    saveAnswers();
    saveUiState();
    renderMode();
    render();
  });
});

gradeBtn.addEventListener("click", () => {
  if (state.mode === "exam") {
    const remaining = unansweredCount("exam");
    if (remaining > 0 && !window.confirm(`아직 ${remaining}문제를 풀지 않았습니다. 그래도 채점할까요?`)) return;
    setExamGraded(true);
    setReviewRetake(false);
    state.reviewIds[state.setId] = missedExamQuestions().map((question) => question.number);
  }
  if (state.mode === "random") {
    const remaining = unansweredCount("random");
    if (remaining > 0 && !window.confirm(`아직 ${remaining}문제를 풀지 않았습니다. 그래도 채점할까요?`)) return;
    setRandomGraded(true);
  }
  if (state.mode === "review" && isReviewRetake()) {
    const remaining = currentQuestions().filter((question) => selectedFor(question, "exam").length === 0).length;
    if (remaining > 0 && !window.confirm(`오답 재풀이 중 ${remaining}문제가 비어 있습니다. 그래도 재채점할까요?`)) return;
    setReviewRetake(false);
    state.reviewIds[state.setId] = missedExamQuestions().map((question) => question.number);
  }
  saveUiState();
  render();
});

retryWrongBtn.addEventListener("click", () => {
  const missed = missedExamQuestions();
  if (missed.length === 0) return;
  state.reviewIds[state.setId] = missed.map((question) => question.number);
  missed.forEach((question) => delete state.answers[answerKey(question, "exam")]);
  setReviewRetake(true);
  state.index = 0;
  state.startedAt = Date.now();
  saveAnswers();
  saveUiState();
  render();
});

toggleNavBtn.addEventListener("click", () => {
  state.navCollapsed = !state.navCollapsed;
  saveUiState();
  render();
});

resetAllBtn.addEventListener("click", () => {
  if (!window.confirm("현재 세트의 연습, 시험, 오답 기록을 모두 초기화할까요?")) return;
  resetAnswersFor("practice");
  resetAnswersFor("exam");
  resetAnswersFor("random");
  setExamGraded(false);
  setRandomGraded(false);
  generateRandomRefs();
  setReviewRetake(false);
  state.reviewIds[state.setId] = [];
  state.index = 0;
  state.startedAt = Date.now();
  saveAnswers();
  saveUiState();
  render();
});

resetBtn.addEventListener("click", resetCurrentSet);
prevBtn.addEventListener("click", () => move(-1));
nextBtn.addEventListener("click", () => move(1));

document.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") move(-1);
  if (event.key === "ArrowRight") move(1);
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    backgroundedAt = Date.now();
    saveAnswers();
    saveUiState();
    return;
  }
  if (document.visibilityState === "visible" && backgroundedAt && Date.now() - backgroundedAt >= 10000 && hasModeProgress()) {
    const shouldReset = window.confirm("앱을 잠시 벗어났습니다. 진행 중인 모드를 초기화할까요?\n\n확인: 초기화\n취소: 이어하기");
    backgroundedAt = 0;
    if (shouldReset) {
      resetCurrentSet();
      return;
    }
    render();
  }
});

window.addEventListener("pagehide", () => {
  saveAnswers();
  saveUiState();
});

renderExamSelect();
renderMode();
render();
updateTimer();
setInterval(updateTimer, 1000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch((error) => {
      console.warn("Service worker registration failed:", error);
    });
  });
}

    </script>
  </body>
</html>
