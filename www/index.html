<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#166064" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ISTQB FL" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <title>ISTQB FL v4.0 샘플문제 풀이</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f5f7f2;
  --ink: #17201c;
  --muted: #637069;
  --line: #dbe2d8;
  --panel: #ffffff;
  --accent: #166064;
  --accent-strong: #0e4548;
  --good: #168044;
  --bad: #bd3930;
  --warn: #b26b00;
  --shadow: 0 18px 45px rgba(23, 32, 28, 0.1);
  --safe-bottom: max(24px, env(safe-area-inset-bottom));
  --safe-top: env(safe-area-inset-top);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: var(--safe-bottom);
  background:
    linear-gradient(120deg, rgba(22, 96, 100, 0.08), transparent 32%),
    linear-gradient(0deg, rgba(181, 92, 60, 0.08), transparent 38%),
    var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
}

button,
select {
  font: inherit;
}

button {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 8px;
  cursor: pointer;
  min-height: 42px;
}

button:hover {
  border-color: var(--accent);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

.app-shell {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: var(--safe-bottom);
}

.sidebar {
  padding: calc(24px + var(--safe-top)) 24px 24px;
  border-right: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
}

.brand {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 28px;
}

.brand img {
  width: 54px;
  height: 54px;
}

.brand p,
.topbar p {
  margin: 0 0 3px;
  color: var(--muted);
  font-size: 13px;
}

.brand h1,
.topbar h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.25;
}

.mobile-sidebar-summary {
  display: none;
}

.sidebar-controls {
  display: block;
}

.panel {
  margin-bottom: 18px;
}

.panel label {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

select {
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
}

.segmented {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #eef2eb;
}

.segmented button {
  min-height: 36px;
  border: 0;
  background: transparent;
  font-weight: 700;
}

.segmented button.active {
  background: var(--panel);
  color: var(--accent-strong);
  box-shadow: 0 6px 16px rgba(23, 32, 28, 0.08);
}

.stats {
  display: grid;
  gap: 10px;
  margin: 24px 0;
}

.stats > div:not(.progress-track) {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}

.stats span {
  color: var(--muted);
  font-size: 13px;
}

.stats strong {
  font-size: 17px;
}

.actions,
.record-actions,
.danger-actions {
  display: grid;
  gap: 10px;
}

.action-section {
  margin-top: 18px;
}

.record-section {
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.quick-grade-section {
  margin: 0 0 18px;
}

.quick-grade-section[hidden] {
  display: none;
}

.quick-grade-section .actions {
  grid-template-columns: 1fr;
}

.action-section h3 {
  margin: 0 0 10px;
  color: var(--muted);
  font-size: 13px;
}

.action-hint,
.backup-status,
.nav-summary {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}

.backup-status {
  min-height: 18px;
  white-space: pre-line;
}

.backup-status.success {
  color: var(--good);
  font-weight: 800;
}

.backup-status.error {
  color: var(--bad);
  font-weight: 800;
}

.danger {
  border-color: #d9b9b5;
  background: #fff4f2;
  color: var(--bad);
  font-weight: 800;
}

.subtle {
  background: #f8faf7;
}

.progress-track {
  height: 8px;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: #e4ebe5;
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), #2a8a73);
  transition: width 0.2s ease;
}

.primary {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
  font-weight: 800;
}

.workspace {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 18px;
  padding: 28px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.topbar-actions {
  display: flex;
  gap: 8px;
}

.topbar-actions button {
  width: 44px;
  font-size: 26px;
  line-height: 1;
}

.question-card {
  display: grid;
  align-content: start;
  gap: 20px;
  min-height: 430px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.question-stem {
  white-space: pre-wrap;
  font-size: 19px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
  overflow-x: auto;
}

.question-figure {
  margin: 4px 0 8px;
  overflow-x: auto;
}

.question-figure img {
  display: block;
  max-width: min(100%, 760px);
  height: auto;
  margin: 0 auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  cursor: zoom-in;
}

.table-block {
  display: block;
  margin: 12px 0;
  padding: 14px;
  overflow-x: auto;
  border: 1px solid #c8d7d2;
  border-radius: 8px;
  background: #f8fbfa;
  color: #102b2d;
  font-family: "Cascadia Mono", "Consolas", monospace;
  font-size: 15px;
  line-height: 1.65;
  white-space: pre;
}

.question-stem .text-line,
.feedback .text-line {
  display: block;
  margin: 0 0 8px;
}

.question-stem .text-line:last-child,
.feedback .text-line:last-child {
  margin-bottom: 0;
}

.choice-token {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 26px;
  min-height: 26px;
  margin: 0 3px;
  padding: 1px 7px;
  border: 1px solid #b8cbc5;
  border-radius: 7px;
  background: #eef7f4;
  color: var(--accent-strong);
  font-weight: 800;
  line-height: 1.35;
}

.options {
  display: grid;
  gap: 12px;
}

.option {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  width: 100%;
  min-height: 58px;
  padding: 13px 14px;
  text-align: left;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.option:disabled {
  cursor: default;
  opacity: 1;
}

.option-text {
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.option-key {
  display: inline-grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #eef2eb;
  color: var(--accent-strong);
  font-weight: 800;
  text-transform: uppercase;
}

.option.selected {
  border-color: var(--accent);
  background: #e2f4f0;
  box-shadow: inset 0 0 0 2px rgba(22, 96, 100, 0.18);
}

.option.selected .option-key {
  background: var(--accent);
  color: white;
}

.option.correct {
  border-color: var(--good);
  background: #edf8f1;
}

.option.wrong {
  border-color: var(--bad);
  background: #fff0ee;
}

.feedback {
  padding: 18px;
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  background: #f7faf6;
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.feedback strong {
  display: block;
  margin-bottom: 6px;
}

.feedback-body {
  display: block;
  white-space: normal;
}

.feedback.collapsed .feedback-body {
  max-height: 118px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 68%, transparent);
  mask-image: linear-gradient(180deg, #000 68%, transparent);
}

.feedback-toggle {
  margin-top: 12px;
  padding: 0 14px;
  min-height: 36px;
  font-weight: 800;
}

.structured-list {
  display: grid;
  gap: 8px;
  margin: 10px 0;
}

.structured-line {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  line-height: 1.55;
}

.structured-marker {
  min-width: 26px;
  padding: 1px 6px;
  border-radius: 7px;
  background: #eef7f4;
  color: var(--accent-strong);
  font-weight: 800;
  text-align: center;
}

.table-scroll {
  margin: 12px 0;
  overflow-x: auto;
  border: 1px solid #c8d7d2;
  border-radius: 8px;
  background: #fbfdfc;
}

.table-hint {
  display: block;
  padding: 8px 12px 0;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.data-table {
  width: 100%;
  margin: 0;
  border-collapse: collapse;
  overflow: hidden;
  background: #fbfdfc;
  font-size: 16px;
}

.data-table th,
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid #dce7e3;
  text-align: left;
}

.data-table th {
  background: #eef7f4;
  color: var(--accent-strong);
  font-weight: 800;
}

.data-table tr:last-child td {
  border-bottom: 0;
}

.question-nav {
  display: grid;
  grid-template-columns: repeat(20, minmax(34px, 1fr));
  gap: 8px;
}

.question-nav button {
  min-height: 36px;
  padding: 0;
  font-weight: 800;
}

.question-nav button.current {
  border-color: var(--accent);
  background: var(--accent);
  color: white;
}

.question-nav button.answered {
  border-color: #94aaa2;
  background: #e5eee9;
}

.question-nav button.unanswered {
  border-style: dashed;
  color: var(--muted);
}

.question-nav button.correct {
  border-color: var(--good);
  background: #edf8f1;
  color: var(--good);
}

.question-nav button.missed {
  border-color: var(--bad);
  background: #fff0ee;
  color: var(--bad);
}

.question-nav.collapsed {
  display: none;
}

.question-nav-toggle {
  min-height: 44px;
  font-weight: 800;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
  background: rgba(23, 32, 28, 0.55);
}

.modal-backdrop[hidden] {
  display: none;
}

.modal-panel {
  width: min(920px, 100%);
  max-height: min(760px, 92vh);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  overflow: hidden;
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
}

.modal-header h3 {
  margin: 0;
  font-size: 18px;
}

.modal-body {
  overflow: auto;
  padding: 18px 20px;
}

.figure-modal img {
  display: block;
  width: 100%;
  height: auto;
  background: white;
}

.wrong-note-list {
  display: grid;
  gap: 10px;
}

.wrong-note-item {
  display: grid;
  gap: 8px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfdfc;
}

.wrong-note-meta {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.wrong-note-text {
  margin: 0;
  line-height: 1.5;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

@media (max-width: 900px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: sticky;
    top: 0;
    z-index: 5;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    margin-bottom: 14px;
  }

  .mobile-sidebar-summary {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }

.mobile-sidebar-summary strong,
.mobile-sidebar-summary span {
  display: block;
}

.mobile-summary-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.mobile-summary-stats span {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #f8faf7;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

  .mobile-sidebar-summary strong {
    font-size: 15px;
  }

  .mobile-sidebar-summary span {
    margin-top: 2px;
    color: var(--muted);
    font-size: 13px;
  }

  .mobile-sidebar-summary button {
    min-height: 38px;
    padding: 0 12px;
    font-weight: 800;
  }

  .sidebar.mobile-collapsed .sidebar-controls {
    display: none;
  }

  .sidebar-controls {
    margin-top: 14px;
  }

  .workspace {
    padding: 18px;
  }

  .question-card {
    padding: 20px;
  }

  .question-stem {
    font-size: 17px;
  }

  .question-nav {
    grid-template-columns: repeat(8, minmax(34px, 1fr));
  }
}

@media (max-width: 640px) {
  .sidebar {
    padding: calc(18px + var(--safe-top)) 18px 18px;
  }

  .workspace {
    padding: 14px;
    gap: 14px;
  }

  .topbar {
    align-items: flex-start;
  }

  .topbar h2 {
    font-size: 18px;
  }

  .actions,
  .record-actions,
  .danger-actions {
    grid-template-columns: 1fr 1fr;
  }

  .actions button,
  .record-actions button,
  .danger-actions button {
    min-height: 44px;
  }

  .primary {
    grid-column: 1 / -1;
  }

  #resetAllBtn,
  #wrongNoteBtn {
    grid-column: 1 / -1;
  }

  .modal-backdrop {
    padding: calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));
  }

  .question-card {
    min-height: 360px;
    padding: 16px;
  }

  .question-stem {
    font-size: 16px;
    line-height: 1.72;
  }

  .question-figure img {
    max-width: 100%;
  }

  .question-stem .table-block {
    font-size: 13px;
    padding: 10px;
  }

  .data-table {
    font-size: 13px;
  }

  .data-table th,
  .data-table td {
    padding: 8px;
  }

  .option {
    grid-template-columns: 30px minmax(0, 1fr);
    padding: 12px;
  }

  .option-key {
    width: 28px;
    height: 28px;
  }
}

    </style>
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="시험 설정">
        <div class="brand">
          <img src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20role%3D%22img%22%20aria-label%3D%22Quiz%20mark%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23166064%22/%3E%0A%20%20%3Cpath%20d%3D%22M18%2018h28v28H18z%22%20fill%3D%22%23f5f7f2%22/%3E%0A%20%20%3Cpath%20d%3D%22M24%2030l5%205%2011-13%22%20fill%3D%22none%22%20stroke%3D%22%23b55c3c%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%0A%20%20%3Cpath%20d%3D%22M22%2047h25%22%20stroke%3D%22%23f5f7f2%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22/%3E%0A%3C/svg%3E%0A" alt="" />
          <div>
            <p>ISTQB FL v4.0</p>
            <h1>샘플문제 풀이</h1>
          </div>
        </div>

        <div class="mobile-sidebar-summary">
          <div>
            <strong id="mobileSetText">샘플문제 A</strong>
            <span id="mobileProgressText">연습 · 0 / 40</span>
            <div class="mobile-summary-stats">
              <span id="mobileProgressBadge">진행 0 / 40</span>
              <span id="mobileTimerBadge">시간 00:00</span>
            </div>
          </div>
          <button id="sidebarToggleBtn" type="button" aria-expanded="false">설정 펼치기</button>
        </div>

        <section id="gradeActionSection" class="action-section quick-grade-section">
          <div class="actions">
            <button id="gradeBtn" class="primary" type="button">채점하기</button>
          </div>
          <p id="actionHint" class="action-hint" aria-live="polite"></p>
        </section>

        <div id="sidebarControls" class="sidebar-controls">
          <section class="panel">
            <label for="examSelect">문제 세트</label>
            <select id="examSelect"></select>
          </section>

          <section class="panel">
            <label>풀이 모드</label>
            <div class="segmented" role="group" aria-label="풀이 모드">
              <button class="active" type="button" data-mode="practice">연습</button>
              <button type="button" data-mode="exam">시험</button>
              <button type="button" data-mode="random">랜덤</button>
              <button type="button" data-mode="review">오답</button>
            </div>
          </section>

          <section class="stats" aria-live="polite">
            <div>
              <span>진행</span>
              <strong id="progressText">0 / 40</strong>
            </div>
            <div>
              <span>시간</span>
              <strong id="timerText">00:00</strong>
            </div>
            <div class="progress-track" aria-hidden="true">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </section>

          <section class="action-section">
            <h3>오답 관리</h3>
            <div class="actions">
              <button id="retryWrongBtn" type="button">오답 다시 풀기</button>
              <button id="wrongNoteBtn" class="subtle" type="button">오답 노트</button>
            </div>
          </section>

          <section class="action-section record-section">
            <h3>기록 관리</h3>
            <div class="record-actions">
              <button id="exportBackupBtn" type="button">기록 내보내기</button>
              <button id="importBackupBtn" type="button">기록 가져오기</button>
            </div>
            <p id="backupStatus" class="backup-status" aria-live="polite">내보내기 후 파일명과 확인 위치가 여기에 표시됩니다.</p>
            <input id="backupFileInput" type="file" accept="application/json,.json" hidden />
          </section>

          <section class="action-section">
            <h3>초기화</h3>
            <div class="danger-actions">
              <button id="resetBtn" class="danger" type="button">현재 모드 풀이 초기화</button>
              <button id="resetAllBtn" class="danger" type="button">현재 세트 기록 전체 삭제</button>
            </div>
          </section>

        </div>
      </aside>

      <section class="workspace" aria-label="문제 풀이 영역">
        <header class="topbar">
          <div>
            <p id="setMeta">샘플문제 A</p>
            <h2 id="questionTitle">문제 1</h2>
          </div>
          <div class="topbar-actions">

        <script src="./questions.js"></script>
    <script>
const data = window.ISTQB_DATA;
const persistenceKey = "istqb-fl-v4-sample-persistence";

const savedUiState = loadUiState();
const state = {
  setId: validSetId(savedUiState.setId),
  mode: validMode(savedUiState.mode),
  index: Number.isInteger(savedUiState.index) ? savedUiState.index : 0,
  examGraded: savedUiState.examGraded || {},
  randomGraded: Boolean(savedUiState.randomGraded),
  randomRefs: Array.isArray(savedUiState.randomRefs) ? savedUiState.randomRefs : [],
  reviewRetake: savedUiState.reviewRetake || {},
  reviewIds: savedUiState.reviewIds || {},
  navCollapsed: Boolean(savedUiState.navCollapsed),
  sidebarCollapsed: savedUiState.sidebarCollapsed !== false,
  startedAt: Number.isFinite(savedUiState.startedAt) ? savedUiState.startedAt : Date.now(),
  answers: loadAnswers(),
};

let backgroundedAt = 0;
let dbPromise = null;

const sidebar = document.querySelector(".sidebar");
const sidebarToggleBtn = document.querySelector("#sidebarToggleBtn");
const mobileSetText = document.querySelector("#mobileSetText");
const mobileProgressText = document.querySelector("#mobileProgressText");
const mobileProgressBadge = document.querySelector("#mobileProgressBadge");

const progressFill = document.querySelector("#progressFill");
const timerText = document.querySelector("#timerText");
const setMeta = document.querySelector("#setMeta");
const questionTitle = document.querySelector("#questionTitle");
const questionStem = document.querySelector("#questionStem");

const exportBackupBtn = document.querySelector("#exportBackupBtn");

const figureModalBody = document.querySelector("#figureModalBody");
const figureModalCloseBtn = document.querySelector("#figureModalCloseBtn");
const wrongNoteModal = document.querySelector("#wrongNoteModal");
const wrongNoteBody = document.querySelector("#wrongNoteBody");
const wrongNoteCloseBtn = document.querySelector("#wrongNoteCloseBtn");
const backupImportModal = document.querySelector("#backupImportModal");
const backupImportBody = document.querySelector("#backupImportBody");
const backupImportCloseBtn = document.querySelector("#backupImportCloseBtn");

let feedbackExpanded = false;
let pendingBackupSnapshot = null;
let pendingBackupPayload = null;
let wrongNoteFilter = "all";

function currentSet() {
  return data.sets.find((set) => set.id === state.setId);
}

function validSetId(setId) {
  return data.sets.some((set) => set.id === setId) ? setId : data.sets[0].id;
}

function validMode(mode) {
  return ["practice", "exam", "random", "review"].includes(mode) ? mode : "practice";
}

function currentQuestions() {
  const questions = currentSet().questions;
  if (state.mode === "random") return randomQuestions();
  if (state.mode !== "review") return questions;
  if (!isExamGraded()) return [];
  if (isReviewRetake()) {
    const ids = state.reviewIds[state.setId] || [];
    return questions.filter((question) => ids.includes(question.number));
  }
  return questions.filter((question) => !isCorrect(question, "exam"));
}

function allQuestions() {
  return data.sets.flatMap((set) =>
    set.questions.map((question) => ({
      ...question,
      setId: set.id,
      setTitle: set.title,
    }))
  );
}

function shuffle(items) {
  const copy = [...items];
  for (let index = copy.length - 1; index > 0; index -= 1) {
    const swapIndex = Math.floor(Math.random() * (index + 1));
    [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
  }
  return copy;
}

function generateRandomRefs() {
  state.randomRefs = shuffle(allQuestions())
    .slice(0, 40)
    .map((question) => ({ setId: question.setId, number: question.number }));
}

function randomQuestions() {
  if (state.randomRefs.length !== 40) generateRandomRefs();
  return state.randomRefs
    .map((ref) => {
      const set = data.sets.find((item) => item.id === ref.setId);
      const question = set?.questions.find((item) => item.number === ref.number);
      return question ? { ...question, setId: set.id, setTitle: set.title } : null;
    })
    .filter(Boolean);
}

function storageKey() {
  return "istqb-fl-v4-sample-answers";
}

function uiStorageKey() {
  return "istqb-fl-v4-sample-ui-state";
}

function buildSnapshot() {
  return {
    updatedAt: Date.now(),
    answers: state.answers,
    uiState: {
      setId: state.setId,
      mode: state.mode,
      index: state.index,
      examGraded: state.examGraded,
      randomGraded: state.randomGraded,
      randomRefs: state.randomRefs,
      reviewRetake: state.reviewRetake,
      reviewIds: state.reviewIds,
      navCollapsed: state.navCollapsed,
      sidebarCollapsed: state.sidebarCollapsed,
      startedAt: state.startedAt,
    },
  };
}

function loadUiState() {
  try {
    return JSON.parse(localStorage.getItem(uiStorageKey())) || {};
  } catch {
    return {};
  }
}

function loadAnswers() {
  try {
    return JSON.parse(localStorage.getItem(storageKey())) || {};
  } catch {
    return {};
  }
}

function saveAnswers() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify(state.answers));
  } catch {
    // Some tablet browsers block localStorage for file:// pages. Keep the in-memory answers usable.
  }
  savePersistentSnapshot();
}

function saveUiState() {
  const uiState = buildSnapshot().uiState;
  try {
    localStorage.setItem(uiStorageKey(), JSON.stringify(uiState));
  } catch {
    // Returning from background still works while the page remains alive.
  }
  savePersistentSnapshot();
}

function openPersistenceDb() {
  if (!("indexedDB" in window)) return Promise.resolve(null);
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve) => {
    const request = indexedDB.open("istqb-fl-v4-sample-db", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("snapshots");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => resolve(null);
    request.onblocked = () => resolve(null);
  });
  return dbPromise;
}

async function savePersistentSnapshot() {
  const snapshot = buildSnapshot();
  try {
    localStorage.setItem(persistenceKey, JSON.stringify(snapshot));
  } catch {
    // IndexedDB below is the fallback for browsers with small or blocked localStorage.
  }
  const db = await openPersistenceDb();
  if (!db) return;
  try {
    const transaction = db.transaction("snapshots", "readwrite");
    transaction.objectStore("snapshots").put(snapshot, "latest");
  } catch {
    // Losing persistence should not interrupt answering a question.
  }
}

async function restorePersistentSnapshot() {
  let snapshot = null;
  let hasUiState = false;
  try {
    snapshot = JSON.parse(localStorage.getItem(persistenceKey));
    hasUiState = Boolean(localStorage.getItem(uiStorageKey()));
  } catch {
    snapshot = null;
  }
  const db = await openPersistenceDb();
  if (db) {
    try {
      snapshot = await new Promise((resolve) => {
        const transaction = db.transaction("snapshots", "readonly");
        const request = transaction.objectStore("snapshots").get("latest");
        request.onsuccess = () => resolve(request.result || snapshot);
        request.onerror = () => resolve(snapshot);
      });
    } catch {
      // Keep whatever localStorage already restored.
    }
  }
  if (!snapshot || typeof snapshot !== "object") return;
  if (snapshot.answers && Object.keys(state.answers).length === 0) {
    state.answers = snapshot.answers;
  }
  if (snapshot.uiState && !hasUiState) {
    Object.assign(state, snapshot.uiState);
    state.setId = validSetId(state.setId);
    state.mode = validMode(state.mode);
  }
  renderExamSelect();
  renderMode();
  render();
}

function backupFileName() {
  const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, "");
  return `istqb-fl-backup-${stamp}.json`;
}

function setBackupStatus(message, type = "") {
  if (!backupStatus) return;
  backupStatus.textContent = message;
  backupStatus.classList.toggle("success", type === "success");
  backupStatus.classList.toggle("error", type === "error");
}

function backupExportMessage(fileName, method) {
  if (method === "share") {
    return [
      "기록 내보내기를 완료했습니다.",
      `파일명: ${fileName}`,
      "확인 위치: 공유 화면에서 선택한 앱 또는 폴더",
    ].join("\n");
  }
  if (method === "clipboard") {
    return [
      "파일 저장을 열 수 없어 백업 JSON을 클립보드에 복사했습니다.",
      `파일명: ${fileName}`,
      "확인 위치: 클립보드",
    ].join("\n");
  }
  return [
    "기록 저장을 요청했습니다.",
    `파일명: ${fileName}`,
    "확인 위치: Android 파일 앱 > 다운로드(Download) 폴더",
  ].join("\n");
}

function androidBackupBridge() {
  return window.AndroidBackup && typeof window.AndroidBackup.saveBackup === "function" ? window.AndroidBackup : null;
}

function saveBackupWithAndroid(fileName, payload) {
  const bridge = androidBackupBridge();
  if (!bridge) return null;
  try {
    const result = JSON.parse(bridge.saveBackup(fileName, payload));
    if (!result.ok) throw new Error(result.error || "Android 저장에 실패했습니다.");
    return result;
  } catch (error) {
    throw new Error(error.message || "Android 다운로드 폴더에 백업을 저장하지 못했습니다.");
  }
}

function buildBackupPayload() {
  return {
    app: "ISTQB FL",
    schemaVersion: 1,
    exportedAt: new Date().toISOString(),
    questionTotal: allQuestions().length,
    snapshot: buildSnapshot(),
  };
}

async function exportBackup() {
  setBackupStatus("기록 내보내기를 준비하고 있습니다. 완료 후 파일명과 확인 위치를 표시합니다.");
  const payload = JSON.stringify(buildBackupPayload(), null, 2);
  const fileName = backupFileName();
  const blob = new Blob([payload], { type: "application/json" });

  try {
    const androidResult = saveBackupWithAndroid(fileName, payload);
    if (androidResult) {
      setBackupStatus([
        "기록 저장을 완료했습니다.",
        `파일명: ${androidResult.fileName || fileName}`,
        `확인 위치: ${androidResult.location || "Android 파일 앱 > 다운로드(Download) 폴더"}`,
      ].join("\n"), "success");
      return;
    }
  } catch (error) {
    setBackupStatus(`${error.message}\n공유 또는 브라우저 다운로드 방식으로 다시 시도합니다.`, "error");
  }

  try {
    if (typeof File !== "undefined" && navigator.canShare && navigator.share) {
      const file = new File([blob], fileName, { type: "application/json" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "ISTQB FL 풀이 기록 백업" });
        setBackupStatus(backupExportMessage(fileName, "share"), "success");
        return;
      }
    }
  } catch (error) {
    if (error.name === "AbortError") {
      setBackupStatus("기록 내보내기를 취소했습니다.");
      return;
    }
  }

  try {
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setBackupStatus(backupExportMessage(fileName, "download"), "success");
  } catch {
    try {
      await navigator.clipboard.writeText(payload);
      setBackupStatus(backupExportMessage(fileName, "clipboard"), "success");
    } catch {
      setBackupStatus("기록 내보내기에 실패했습니다. 앱 권한 또는 브라우저 다운로드 설정을 확인하세요.", "error");
    }
  }
}

function readBackupFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("백업 파일을 읽을 수 없습니다."));
    reader.readAsText(file);
  });
}

function isPlainObject(value) {
  return Boolean(value) && typeof value === "object" && !Array.isArray(value);
}

function sanitizeAnswerState(value) {
  const result = {};
  if (!isPlainObject(value)) return result;
  Object.entries(value).forEach(([key, choices]) => {
    if (!Array.isArray(choices)) return;
    const filtered = choices.filter((choice) => /^[a-e]$/.test(choice));
    if (filtered.length > 0) result[key] = filtered;
  });
  return result;
}

function sanitizeBooleanRecord(value) {
  const result = {};
  if (!isPlainObject(value)) return result;
  data.sets.forEach((set) => {
    if (Object.prototype.hasOwnProperty.call(value, set.id)) result[set.id] = Boolean(value[set.id]);
  });
  return result;
}

function sanitizeReviewIds(value) {
  const result = {};
  if (!isPlainObject(value)) return result;
  data.sets.forEach((set) => {
    const ids = Array.isArray(value[set.id]) ? value[set.id] : [];
    result[set.id] = ids.filter((number) => Number.isInteger(number) && number > 0);
  });
  return result;
}

function sanitizeRandomRefs(value) {
  if (!Array.isArray(value)) return [];
  return value
    .filter((ref) => isPlainObject(ref) && validSetId(ref.setId) === ref.setId && Number.isInteger(ref.number))
    .map((ref) => ({ setId: ref.setId, number: ref.number }));
}

function extractBackupSnapshot(payload) {
  if (!isPlainObject(payload)) throw new Error("백업 JSON 형식이 올바르지 않습니다.");
  const snapshot = isPlainObject(payload.snapshot) ? payload.snapshot : payload;
  if (!isPlainObject(snapshot.answers) || !isPlainObject(snapshot.uiState)) {
    throw new Error("풀이 기록 백업 파일이 아닙니다.");
  }
  return snapshot;
}

function summarizeBackup(snapshot, payload = {}) {
  const uiState = snapshot.uiState || {};
  const set = data.sets.find((item) => item.id === uiState.setId) || data.sets[0];
  const mode = validMode(uiState.mode);
  const answers = sanitizeAnswerState(snapshot.answers);
  const answerCount = Object.keys(answers).length;
  const questionCount = Number.isFinite(payload.questionTotal) ? payload.questionTotal : allQuestions().length;
  const exportedAt = payload.exportedAt ? new Date(payload.exportedAt) : null;
  return {
    setTitle: set.title,
    modeLabel: modeLabel(mode),
    index: Number.isInteger(uiState.index) ? uiState.index + 1 : 1,
    answerCount,
    questionCount,
    exportedAtText: exportedAt && !Number.isNaN(exportedAt.getTime()) ? exportedAt.toLocaleString() : "알 수 없음",
  };
}

function applyBackupSnapshot(snapshot) {
  const uiState = snapshot.uiState;
  state.answers = sanitizeAnswerState(snapshot.answers);
  state.setId = validSetId(uiState.setId);
  state.mode = validMode(uiState.mode);
  state.index = Number.isInteger(uiState.index) && uiState.index >= 0 ? uiState.index : 0;
  state.examGraded = sanitizeBooleanRecord(uiState.examGraded);
  state.randomGraded = Boolean(uiState.randomGraded);
  state.randomRefs = sanitizeRandomRefs(uiState.randomRefs);
  state.reviewRetake = sanitizeBooleanRecord(uiState.reviewRetake);
  state.reviewIds = sanitizeReviewIds(uiState.reviewIds);
  state.navCollapsed = Boolean(uiState.navCollapsed);
  state.startedAt = Number.isFinite(uiState.startedAt) ? uiState.startedAt : Date.now();
}

async function importBackup(file) {
  if (!file) return;
  setBackupStatus(`${file.name} 내용을 확인하고 있습니다.`);
  try {
    const text = await readBackupFile(file);
    const payload = JSON.parse(text);
    const snapshot = extractBackupSnapshot(payload);
    openBackupImportSummary(snapshot, payload);
    setBackupStatus("가져올 기록을 확인했습니다. 요약 모달에서 적용 여부를 선택하세요.", "success");
  } catch (error) {
    setBackupStatus("기록 가져오기에 실패했습니다. JSON 백업 파일인지 확인하세요.", "error");
    window.alert(error.message || "백업 파일을 불러오지 못했습니다.");
  }
}

function openBackupImportSummary(snapshot, payload) {
  pendingBackupSnapshot = snapshot;
  pendingBackupPayload = payload;
  const summary = summarizeBackup(snapshot, payload);
  backupImportBody.replaceChildren();

  const info = document.createElement("div");
  info.className = "wrong-note-list";
  [
    ["저장 시각", summary.exportedAtText],
    ["문제 세트", summary.setTitle],
    ["풀이 모드", summary.modeLabel],
    ["현재 위치", `문제 ${summary.index}`],
    ["저장 답안", `${summary.answerCount}개`],
    ["백업 기준 문항", `${summary.questionCount}문항`],
  ].forEach(([label, value]) => {
    const row = document.createElement("div");
    row.className = "wrong-note-item";
    const meta = document.createElement("span");
    meta.className = "wrong-note-meta";
    meta.textContent = label;
    const text = document.createElement("p");
    text.className = "wrong-note-text";
    text.textContent = value;
    row.append(meta, text);
    info.appendChild(row);
  });

  const actions = document.createElement("div");
  actions.className = "record-actions";
  const apply = document.createElement("button");
  apply.type = "button";
  apply.className = "primary";
  apply.textContent = "이 기록 가져오기";
  apply.addEventListener("click", confirmBackupImport);
  const cancel = document.createElement("button");
  cancel.type = "button";
  cancel.textContent = "취소";
  cancel.addEventListener("click", closeBackupImport);
  actions.append(apply, cancel);
  backupImportBody.append(info, actions);
  backupImportModal.hidden = false;
}

function closeBackupImport() {
  backupImportModal.hidden = true;
  backupImportBody.replaceChildren();
  pendingBackupSnapshot = null;
  pendingBackupPayload = null;
}

function confirmBackupImport() {
  if (!pendingBackupSnapshot) return;
  applyBackupSnapshot(pendingBackupSnapshot);
  saveAnswers();
  saveUiState();
  renderExamSelect();
  renderMode();
  render();
  closeBackupImport();
  setBackupStatus("기록 가져오기를 완료했습니다.", "success");
  window.alert("풀이 기록을 불러왔습니다.");
}

function answerKey(question, mode = answerMode()) {
  const setId = question.setId || state.setId;
  return `${setId}-${mode}-${question.number}`;
}

function answerMode() {
  return state.mode === "review" ? "exam" : state.mode;
}

function selectedFor(question, mode = answerMode()) {
  return state.answers[answerKey(question, mode)] || [];
}

function sameChoices(left, right) {
  return [...left].sort().join(",") === [...right].sort().join(",");
}

function isCorrect(question, mode = answerMode()) {
  return sameChoices(selectedFor(question, mode), question.answer);
}

function isExamGraded() {
  return Boolean(state.examGraded[state.setId]);
}

function setExamGraded(value) {
  state.examGraded[state.setId] = value;
}

function isRandomGraded() {
  return Boolean(state.randomGraded);
}

function setRandomGraded(value) {
  state.randomGraded = value;
}

function isReviewRetake() {
  return Boolean(state.reviewRetake[state.setId]);
}

function setReviewRetake(value) {
  state.reviewRetake[state.setId] = value;
}

function resetAnswersFor(mode) {
  const questions = mode === "random" ? randomQuestions() : currentSet().questions;
  questions.forEach((question) => delete state.answers[answerKey(question, mode)]);
}

function unansweredCount(mode = answerMode()) {
  const questions = mode === "random" ? randomQuestions() : currentSet().questions;
  return questions.filter((question) => selectedFor(question, mode).length === 0).length;
}

function missedExamQuestions() {
  return currentSet().questions.filter((question) => !isCorrect(question, "exam"));
}

function missedRandomQuestions() {
  return randomQuestions().filter((question) => !isCorrect(question, "random"));
}

function formatChoice(choices) {
  return choices.map((choice) => choice.toUpperCase()).join(", ");
}

function figureFor(question) {
  const setId = question.setId || state.setId;
  const key = `${setId}${question.number}`;
  const figures = {
    A23: "figures/A23.png",
    B23: "figures/B23.png",
    C23: "figures/C23.png",
    C24: "figures/C24.png",
    C31: "figures/C31.png",
    C32: "figures/C32.png",
  };
  return figures[key] || "";
}

function renderFigure(question) {
  const src = figureFor(question);
  questionFigure.replaceChildren();
  questionFigure.hidden = !src;
  if (!src) return;
  const image = document.createElement("img");
  image.src = src;
  image.alt = `문제 ${question.number} 그림`;
  image.loading = "lazy";
  image.draggable = false;
  image.addEventListener("click", () => openFigureModal(src, image.alt));
  questionFigure.appendChild(image);
}

function openFigureModal(src, alt) {
  figureModalBody.replaceChildren();
  const image = document.createElement("img");
  image.src = src;
  image.alt = alt;
  image.draggable = false;
  figureModalBody.appendChild(image);
  figureModal.hidden = false;
}

function closeFigureModal() {
  figureModal.hidden = true;
  figureModalBody.replaceChildren();
}

function modeLabel(mode = state.mode) {
  return {
    practice: "연습",
    exam: "시험",
    random: "랜덤",
    review: "오답",
  }[mode] || "현재";
}

function renderExamSelect() {
  const setOptions = data.sets.map((set) => {
    const option = document.createElement("option");
    option.value = set.id;
    option.textContent = set.title;
    return option;
  });
  examSelect.replaceChildren(...setOptions);
  examSelect.value = state.setId;
}

function renderMode() {
  document.querySelectorAll("[data-mode]").forEach((button) => {
    button.classList.toggle("active", button.dataset.mode === state.mode);
  });
  examSelect.disabled = state.mode === "random";
}

function renderSidebarSummary() {
  const questions = state.mode === "review" || state.mode === "random" ? currentQuestions() : currentSet().questions;
  const answered = questions.filter((question) => selectedFor(question).length).length;
  sidebar.classList.toggle("mobile-collapsed", state.sidebarCollapsed);
  sidebarToggleBtn.textContent = state.sidebarCollapsed ? "설정 펼치기" : "설정 접기";
  sidebarToggleBtn.setAttribute("aria-expanded", String(!state.sidebarCollapsed));
  mobileSetText.textContent = state.mode === "random" ? "전체 랜덤" : currentSet().title;
  mobileProgressText.textContent = `${modeLabel()} · ${answered} / ${questions.length}`;
  mobileProgressBadge.textContent = `진행 ${answered} / ${questions.length}`;
}

function renderRichText(target, text, options = {}) {
  target.replaceChildren();
  const blocks = buildRichBlocks(text);
  blocks.forEach((block) => {
    if (options.plainContent) {
      renderPlainBlock(target, block);
      return;
    }
    if (block.type === "table") {
      target.appendChild(renderDataTable(block));
      return;
    }
    if (block.type === "list") {
      target.appendChild(renderStructuredList(block.items));
      return;
    }
    const line = block.text;
    if (isTableLikeLine(line)) {
      const tableBlock = document.createElement("span");
      tableBlock.className = "table-block";
      tableBlock.textContent = line;
      target.appendChild(tableBlock);
      return;
    }
    const lineNode = document.createElement("span");
    lineNode.className = "text-line";
    lineNode.textContent = line;
    target.appendChild(lineNode);
  });
}

function renderPlainBlock(target, block) {
  if (block.type === "table") {
    target.appendChild(renderDataTable(block));
    return;
  }
  if (block.type === "list") {
    block.items.forEach((item) => appendPlainLine(target, `${plainMarker(item.marker)} ${item.text}`));
    return;
  }
  appendPlainLine(target, block.text);
}

function appendPlainLine(target, text) {
  if (!String(text || "").trim()) return;
  const lineNode = document.createElement("span");
  lineNode.className = "text-line";
  lineNode.textContent = text;
  target.appendChild(lineNode);
}

function plainMarker(marker) {
  return isBulletMarker(marker) ? "•" : marker;
}

function isTableLikeLine(line) {
  return /\|/.test(line) || / {3,}/.test(line) || /\t/.test(line);
}

function formatReadableText(text) {
  return splitStructuralMarkers(splitKnownSectionHeadings(stripPdfNoise(text)));
}

function splitStructuralMarkers(text) {
  return String(text || "")
    .replace(/\s*(?=(?:\d+\.|[A-E]\.|[\u2022\uF06C\uF0A1\uF0A7\uF0B7])\s)/g, "\n")
    .replace(/\s*(?=\(\d+\)\s)/g, "\n")
    .replace(/(^|\s)([a-e]\))\s+/g, "$1\n$2 ")
    .replace(/\s*(?=(?:당신은 다음과 같이 테스트 케이스 세트를 도출했다:|테스트 케이스로 달성한))/g, "\n")
    .replace(/\s*(?=(?:리뷰 활동은 다음과 같다:|그리고 다음과 같은 완화 활동이 있다\.|다음 중 위|다음 중 분석한))/g, "\n")
    .replace(/\s*(?=(?:환경 구성:|테스트 케이스 세트:|TC\d+\s+실행))/g, "\n")
    .replace(/\s*(따라서:)/g, "\n$1")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function splitKnownSectionHeadings(text) {
  const headings = [
    "당신은 다음과 같이 테스트 케이스 세트를 도출했다:",
    "테스트 케이스로 달성한",
    "다음과 같은 테스트 활동이 있다:",
    "그리고 다음과 같은 테스트 활동이 있다:",
    "다음과 같은 완화 활동이 있다.",
    "그리고 다음과 같은 완화 활동이 있다.",
    "다음 중 위",
    "다음 중 이",
    "다음 중 업무와",
    "다음 중 테스트",
    "어떤 테스트 케이스가",
  ];
  return headings.reduce((value, heading) => value.replaceAll(heading, `\n${heading}`), text);
}

function stripPdfNoise(text) {
  return String(text || "")
    .replace(/Korean Software Testing Qualifications Board[^\n]*/gi, "")
    .replace(/www\.kstqb\.org\s+I\s+info@kstqb\.org(?:\s+\d+\s+of\s+\d+)?/gi, "")
    .replace(/www\.kstqb\.org\s*/gi, "")
    .replace(/info@kstqb\.org\s*/gi, "")
    .replace(/\b\d+\s+of\s+\d+\b/gi, "")
    .replace(/\s{2,}/g, " ");
}

function buildRichBlocks(text) {
  const cleaned = splitKnownSectionHeadings(stripPdfNoise(text));
  const formatted = normalizeKnownTables(cleaned);
  const lines = formatted
    .split("\n")
    .flatMap((line) => line.startsWith("__TABLE__:") ? [line] : splitStructuralMarkers(line).split("\n"))
    .map((line) => line.trim())
    .filter(Boolean);
  const blocks = [];
  let pendingList = [];

  const flushList = () => {
    if (pendingList.length > 0) {
      blocks.push({ type: "list", items: pendingList });
      pendingList = [];
    }
  };

  lines.forEach((line) => {
    if (line.startsWith("__TABLE__:")) {
      flushList();
      blocks.push({ type: "table", rows: JSON.parse(line.slice(10)) });
      return;
    }
    const listItem = parseStructuredItem(line);
    if (listItem) {
      pendingList.push(listItem);
      return;
    }
    flushList();
    blocks.push({ type: "text", text: line });
  });
  flushList();
  return blocks;
}

function parseStructuredItem(line) {
  const match = line.match(/^(\d+\.|\(\d+\)|[A-E]\.|[a-e]\)|[\u2022\uF06C\uF0A1\uF0A7\uF0B7])\s*(.+)$/i);
  if (!match) return null;
  return { marker: match[1], text: match[2].trim() };
}

function renderStructuredList(items) {
  const list = document.createElement("span");
  list.className = "structured-list";
  items.forEach((item) => {
    const row = document.createElement("span");
    row.className = "structured-line";
    const marker = document.createElement("span");
    marker.className = "structured-marker";
    marker.textContent = isBulletMarker(item.marker) ? "•" : item.marker;
    const body = document.createElement("span");
    body.textContent = item.text;
    row.append(marker, body);
    list.appendChild(row);
  });
  return list;
}

function isBulletMarker(marker) {
  return /^[\u2022\uF06C\uF0A1\uF0A7\uF0B7]$/.test(marker);
}

function renderDataTable(block) {
  const wrapper = document.createElement("div");
  wrapper.className = "table-scroll";
  const hint = document.createElement("span");
  hint.className = "table-hint";
  hint.textContent = "표는 좌우로 밀어 볼 수 있습니다.";
  const table = document.createElement("table");
  table.className = "data-table";
  const thead = document.createElement("thead");
  const tbody = document.createElement("tbody");
  block.rows.forEach((row, rowIndex) => {
    const tr = document.createElement("tr");
    row.forEach((cell) => {
      const node = document.createElement(rowIndex === 0 ? "th" : "td");
      node.textContent = cell;
      tr.appendChild(node);
    });
    (rowIndex === 0 ? thead : tbody).appendChild(tr);
  });
  table.append(thead, tbody);
  wrapper.append(hint, table);
  return wrapper;
}

function normalizeKnownTables(text) {
  return normalizePlanningPokerTable(
    normalizeSortLogTable(
      normalizeDecisionTable(
        normalizeTraceabilityMatrix(
          normalizeHotelTransitionTable(
            normalizeDrivingDecisionTable(
              normalizeClassificationDecisionTable(
                normalizeArteryDecisionTable(
                  normalizeRestaurantPriorityTable(
                    normalizeExecutionHistoryTable(
                      normalizeTestPriorityTable(normalizeFinalGradeTable(normalizeProjectEffortTable(text)))
                    )
                  )
                )
              )
            )
          )
        )
      )
    )
  );
}

function normalizePlanningPokerTable(text) {
  const pattern = /(?:\ud300\uc6d0\ub4e4\uc758 \ucd94\uc815\s+)?1\s+\ub77c\uc6b4\ub4dc\s+((?:\d+\s+){6}\d+)\s+2\s+\ub77c\uc6b4\ub4dc\s+((?:\d+\s+){6}\d+)\s+3\s+\ub77c\uc6b4\ub4dc\s+((?:\d+\s+){6}\d+)/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [["\ub77c\uc6b4\ub4dc", "\ucd94\uc815 1", "\ucd94\uc815 2", "\ucd94\uc815 3", "\ucd94\uc815 4", "\ucd94\uc815 5", "\ucd94\uc815 6", "\ucd94\uc815 7"]];
  [1, 2, 3].forEach((round) => {
    rows.push([String(round), ...match[round].trim().split(/\s+/)]);
  });
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeExecutionHistoryTable(text) {
  const pattern = /첫 번째 실행\s+두 번째 실행\s+세 번째 실행\s+TC1\s+\((\d+)\)\s+(합격|실패)\s+\((\d+)\)\s+(합격|실패)\s+\((\d+)\)\s+(합격|실패)\s+TC2\s+\((\d+)\)\s+(합격|실패)\s+\((\d+)\)\s+(합격|실패)\s+\((\d+)\)\s+(합격|실패)\s+TC3\s+\((\d+)\)\s+(합격|실패)\s+\((\d+)\)\s+(합격|실패)\s+\((\d+)\)\s+(합격|실패)/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [["TC", "첫 번째 실행", "두 번째 실행", "세 번째 실행"]];
  for (let row = 0; row < 3; row += 1) {
    const offset = row * 6 + 1;
    rows.push([`TC${row + 1}`, `(${match[offset]}) ${match[offset + 1]}`, `(${match[offset + 2]}) ${match[offset + 3]}`, `(${match[offset + 4]}) ${match[offset + 5]}`]);
  }
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeRestaurantPriorityTable(text) {
  const header = "번호 커버되는 테스트 컨디션 우선순위 논리적 종속성";
  const start = text.indexOf(header);
  if (start < 0) return text;
  const tail = text.slice(start + header.length);
  const pattern = /(TC\d{3})\s+(.+?)\s+(\d+)\s+(.+?)(?=\s+TC\d{3}\s+|다음 중|$)/g;
  const rows = [["번호", "커버되는 테스트 컨디션", "우선순위", "논리적 종속성"]];
  let match;
  let consumed = 0;
  while ((match = pattern.exec(tail))) {
    rows.push([match[1], match[2].trim(), match[3], match[4].trim()]);
    consumed = pattern.lastIndex;
  }
  if (rows.length < 3) return text;
  return `${text.slice(0, start).trim()}\n${header}\n__TABLE__:${JSON.stringify(rows)}\n${tail.slice(consumed).trim()}`;
}

function normalizeArteryDecisionTable(text) {
  const pattern = /규칙 1\s+규칙 2\s+규칙 3\s+규칙 4\s+규칙 5\s+조건\s+콜레스테롤\(mg\/dl\)\s+≤ 124\s+≤ 124\s+125 - 200\s+125-200\s+≥ 201\s+혈압\(mmHg\)\s+≤ 140\s+> 140\s+≤ 140\s+> 140\s+-\s+결과\s+위험 수준\s+매우 낮음\s+낮음\s+중간\s+높음\s+매우 높음/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [
    ["항목", "규칙 1", "규칙 2", "규칙 3", "규칙 4", "규칙 5"],
    ["콜레스테롤(mg/dl)", "≤ 124", "≤ 124", "125 - 200", "125-200", "≥ 201"],
    ["혈압(mmHg)", "≤ 140", "> 140", "≤ 140", "> 140", "-"],
    ["위험 수준", "매우 낮음", "낮음", "중간", "높음", "매우 높음"],
  ];
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeClassificationDecisionTable(text) {
  const pattern = /R1\s+R2\s+R3\s+R4\s+R5\s+R6\s+R7\s+C1:\s+나이\s+0-18\s+19-65\s+19-65\s+>65\s+0-18\s+19-65\s+>65\s+C2:\s+경험\s+-\s+0-4\s+>4\s+-\s+-\s+-\s+-\s+C3:\s+등록유무\s+NO\s+NO\s+NO\s+NO\s+YES\s+YES\s+YES\s+분류\s+A\s+A\s+B\s+B\s+B\s+D\s+C/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [
    ["항목", "R1", "R2", "R3", "R4", "R5", "R6", "R7"],
    ["C1: 나이", "0-18", "19-65", "19-65", ">65", "0-18", "19-65", ">65"],
    ["C2: 경험", "-", "0-4", ">4", "-", "-", "-", "-"],
    ["C3: 등록유무", "NO", "NO", "NO", "NO", "YES", "YES", "YES"],
    ["분류", "A", "A", "B", "B", "B", "D", "C"],
  ];
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeDrivingDecisionTable(text) {
  const pattern = /R1\s+R2\s+R3\s+C1:\s+첫 시험 도전\?\s+-\s+-\s+F\s+C2:\s+이론 시험 합격\?\s+T\s+F\s+-\s+C3:\s+실기 시험 합격\?\s+T\s+-\s+F\s+운전 면허 발급\?\s+X\s+운전 강습 추가 요청\?\s+X\s+시험 재-응시 요청\?\s+X/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [
    ["항목", "R1", "R2", "R3"],
    ["C1: 첫 시험 도전?", "-", "-", "F"],
    ["C2: 이론 시험 합격?", "T", "F", "-"],
    ["C3: 실기 시험 합격?", "T", "-", "F"],
    ["운전 면허 발급?", "X", "", ""],
    ["운전 강습 추가 요청?", "", "X", ""],
    ["시험 재-응시 요청?", "", "", "X"],
  ];
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeHotelTransitionTable(text) {
  const pattern = /이벤트\s+상태\s+예약 가능\s+예약 불가\s+객실 변경\s+취소\s+결제\s+S1:\s+요청 중\s+S2\s+S3\s+S2:\s+확인됨\s+S1\s+S4\s+S4\s+S3:\s+대기자 명단\s+S2\s+S4\s+S4:\s+종료/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [
    ["상태", "예약 가능", "예약 불가", "객실 변경", "취소", "결제"],
    ["S1: 요청 중", "S2", "S3", "", "", ""],
    ["S2: 확인됨", "", "", "S1", "S4", "S4"],
    ["S3: 대기자 명단", "S2", "", "", "S4", ""],
    ["S4: 종료", "", "", "", "", ""],
  ];
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeTraceabilityMatrix(text) {
  const pattern = /Req 1\s+Req 2\s+Req 3\s+Req 4\s+Req 5\s+Req 6\s+Req 7\s+TC1\s+X\s+X\s+X\s+X\s+TC2\s+X\s+X\s+X\s+TC3\s+X\s+X\s+TC4\s+X/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [
    ["TC", "Req 1", "Req 2", "Req 3", "Req 4", "Req 5", "Req 6", "Req 7"],
    ["TC1", "X", "", "X", "X", "", "", "X"],
    ["TC2", "X", "", "", "", "X", "", "X"],
    ["TC3", "", "", "", "X", "X", "", ""],
    ["TC4", "", "X", "", "", "", "", ""],
  ];
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeDecisionTable(text) {
  if (!/조건\s+R1\s+R2\s+R3\s+R4\s+R5\s+R6\s+R7\s+R8/.test(text)) return text;
  const pattern = /조건\s+R1\s+R2\s+R3\s+R4\s+R5\s+R6\s+R7\s+R8\s+회원\s+([TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF])\s+반납기한 경과\s+([TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF])\s+15회 대여\s+([TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF]\s+[TF])\s+결과\s+20% 할인\s+([\sX]*?)\s+티셔츠 선물\s+([\sX]*?)(?=\s+고객 관리|\s+다음 중|$)/;
  const match = text.match(pattern);
  if (!match) return text;
  const rules = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8"];
  const rows = [
    ["항목", ...rules],
    ["회원", ...match[1].split(/\s+/)],
    ["반납기한 경과", ...match[2].split(/\s+/)],
    ["15회 대여", ...match[3].split(/\s+/)],
    ["20% 할인", "", "X", "", "X", "", "", "", ""],
    ["티셔츠 선물", "", "", "X", "X", "", "", "", "X"],
  ];
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeTestPriorityTable(text) {
  const header = "테스트 우선순위(1 = 가장 높은 우선순위)";
  const headerIndex = text.indexOf(header);
  if (headerIndex < 0) return text;

  const tail = text.slice(headerIndex + header.length);
  const rows = [["테스트 케이스", "설명", "우선순위"]];
  const pattern = /TC(\d+)\s+(.+?)\s+(\d+)(?=\s+TC\d+\s+|또한|$)/g;
  let match;
  let consumed = 0;
  while ((match = pattern.exec(tail))) {
    rows.push([`TC${match[1]}`, match[2].trim(), match[3]]);
    consumed = pattern.lastIndex;
  }
  if (rows.length < 3) return text;

  const before = text.slice(0, headerIndex);
  const after = tail.slice(consumed).trim();
  return `${before.trim()}\n${header}\n__TABLE__:${JSON.stringify(rows)}\n${after}`;
}

function normalizeFinalGradeTable(text) {
  const header = "최종 점수 최종 성적";
  const headerIndex = text.indexOf(header);
  if (headerIndex < 0) return text;

  const tail = text.slice(headerIndex + header.length);
  const rows = [["테스트 케이스", "최종 점수", "최종 성적"]];
  const pattern = /TC(\d+)\s+(\d+)\s+(.+?)(?=\s+TC\d+\s+\d+|\s+테스트 케이스로|\s+다음 중|$)/g;
  let match;
  let consumed = 0;
  while ((match = pattern.exec(tail))) {
    rows.push([`TC${match[1]}`, match[2], match[3].trim()]);
    consumed = pattern.lastIndex;
  }
  if (rows.length < 3) return text;

  const before = text.slice(0, headerIndex);
  const after = tail.slice(consumed).trim();
  return `${before.trim()}\n__TABLE__:${JSON.stringify(rows)}\n${after}`;
}

function normalizeProjectEffortTable(text) {
  const pattern = /프로젝트 개발 노력\(\$\) 테스트 노력\(\$\)\s+P1\s+([\d,]+)\s+([\d,]+)\s+P2\s+([\d,]+)\s+([\d,]+)\s+P3\s+([\d,]+)\s+([\d,]+)\s+P4\s+([\d,]+)\s+([\d,]+)/;
  const match = text.match(pattern);
  if (!match) return text;
  const rows = [
    ["프로젝트", "개발 노력($)", "테스트 노력($)"],
    ["P1", match[1], match[2]],
    ["P2", match[3], match[4]],
    ["P3", match[5], match[6]],
    ["P4", match[7], match[8]],
  ];
  return text.replace(match[0], `\n__TABLE__:${JSON.stringify(rows)}\n`);
}

function normalizeSortLogTable(text) {
  if (!/테스트 실행 로그/.test(text) || !/TC1\s+실행/.test(text)) return text;
  const questionSplit = text.match(/([\s\S]*?)(다음 중[\s\S]*)$/);
  const mainText = questionSplit ? questionSplit[1] : text;
  const questionText = questionSplit ? questionSplit[2] : "";
  const introSplit = mainText.split(/환경 구성:/);
  if (introSplit.length < 2) return text;

  const rows = [["TC", "입력", "출력", "결과"]];
  const logText = `환경 구성:${introSplit.slice(1).join("환경 구성:")}`;
  const tcPattern = /TC(\d+)\s+실행\.\s+입력:\s*([\s\S]*?)\s+출력:\s*([\s\S]*?)\s+결과:\s*(통과|실패)/g;
  let match;
  while ((match = tcPattern.exec(logText))) {
    rows.push([`TC${match[1]}`, compactCell(match[2]), compactCell(match[3]), match[4]]);
  }
  if (rows.length === 1) return text;
  const meta = logText
    .replace(/TC1\s+실행[\s\S]*/, "")
    .replace(/^환경 구성:\s*/, "")
    .replace(/\s*,\s*/g, "\n")
    .trim();
  return `${introSplit[0].trim()}\n환경 구성:\n${meta}\n__TABLE__:${JSON.stringify(rows)}\n${questionText.trim()}`;
}

function compactCell(text) {
  return String(text || "")
    .replace(/\d{1,2}:\d{2}:\d{2}\.\d{3}/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function render() {
  const set = currentSet();
  const questions = currentQuestions();
  const canGrade = state.mode === "exam" || state.mode === "random" || (state.mode === "review" && isReviewRetake());
  gradeActionSection.hidden = state.mode === "practice";
  gradeBtn.hidden = state.mode === "practice";
  gradeBtn.disabled = !canGrade;
  gradeBtn.textContent = state.mode === "review" && isReviewRetake() ? "오답 재채점" : "채점하기";
  retryWrongBtn.hidden = state.mode !== "review" || !isExamGraded() || isReviewRetake() || missedExamQuestions().length === 0;
  wrongNoteBtn.disabled = !hasWrongNoteItems();
  const navPosition = questions.length > 0 ? ` · 현재 ${state.index + 1} / ${questions.length}` : "";
  toggleNavBtn.textContent = `${state.navCollapsed ? "문제 번호 펼치기" : "문제 번호 접기"}${navPosition}`;
  toggleNavBtn.setAttribute("aria-expanded", String(!state.navCollapsed));
  resetBtn.textContent = `${modeLabel()} 풀이 초기화`;
  questionNav.classList.toggle("collapsed", state.navCollapsed);
  navSummary.hidden = !state.navCollapsed;
  if (questions.length === 0) {
    setMeta.textContent = state.mode === "random" ? "전체 랜덤 40문항" : `${set.title} · ${set.questions.length}문항`;
    questionTitle.textContent = "오답 없음";
    questionStem.textContent = isExamGraded()
      ? "채점한 시험에서 틀린 문제가 없습니다."
      : "시험 모드에서 채점하면 오답만 표시됩니다.";
    questionFigure.replaceChildren();
    questionFigure.hidden = true;
    options.replaceChildren();
    feedback.hidden = true;
    navSummary.textContent = "표시할 문제가 없습니다.";
    renderNav(questions);
    renderStats();
    renderActionHint(questions);
    saveUiState();
    return;
  }
  if (state.index >= questions.length) state.index = questions.length - 1;
  if (state.index < 0) state.index = 0;
  saveUiState();
  const question = questions[state.index];
  const selected = selectedFor(question);
  const multi = question.answer.length > 1;

  setMeta.textContent = state.mode === "random" ? `${question.setTitle} · 랜덤 ${state.index + 1} / ${questions.length}` : `${set.title} · ${set.questions.length}문항`;
  questionTitle.textContent = `문제 ${state.index + 1} / ${questions.length}${multi ? " · 복수정답" : ""}`;
  renderRichText(questionStem, question.stem, { plainContent: true });
  renderFigure(question);
  navSummary.textContent = `현재 ${state.index + 1} / ${questions.length}`;

  options.replaceChildren();
  question.options.forEach((option) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "option";
    button.disabled = isAnswerLocked();
    const isSelected = selected.includes(option.key);
    button.classList.toggle("selected", isSelected);
    if (shouldShowResults()) {
      button.classList.toggle("correct", question.answer.includes(option.key));
      button.classList.toggle("wrong", isSelected && !question.answer.includes(option.key));
    }
    const key = document.createElement("span");
    key.className = "option-key";
    key.textContent = option.key;
    const text = document.createElement("span");
    text.className = "option-text";
    renderRichText(text, option.text, { plainContent: true });
    button.draggable = false;
    button.append(key, text);
    button.addEventListener("click", () => chooseOption(question, option.key));
    options.appendChild(button);
  });

  feedback.hidden = !shouldShowFeedback(selected);
  if (!feedback.hidden) {
    const result = isCorrect(question) ? "정답" : "오답";
    feedback.replaceChildren();
    feedback.classList.toggle("collapsed", !feedbackExpanded);
    const title = document.createElement("strong");
    title.textContent = `${result} · 정답 ${formatChoice(question.answer)}`;
    const explanation = document.createElement("span");
    explanation.className = "feedback-body";
    renderRichText(explanation, question.explanation);
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "feedback-toggle";
    toggle.textContent = feedbackExpanded ? "해설 접기" : "해설 펼치기";
    toggle.addEventListener("click", () => {
      feedbackExpanded = !feedbackExpanded;
      render();
    });
    feedback.append(title, explanation, toggle);
  } else {
    feedback.classList.remove("collapsed");
  }

  renderNav(questions);
  renderStats();
  renderActionHint(questions);
}

function renderNav(questions) {
  questionNav.replaceChildren();
  questions.forEach((question, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = state.mode === "random" ? index + 1 : question.number;
    button.classList.toggle("current", index === state.index);
    button.classList.toggle("answered", selectedFor(question).length > 0);
    button.classList.toggle("correct", shouldShowResults() && isCorrect(question));
    button.classList.toggle("missed", shouldShowResults() && !isCorrect(question));
    button.classList.toggle("unanswered", selectedFor(question).length === 0);
    button.addEventListener("click", () => {
      feedbackExpanded = false;
      state.index = index;
      render();
    });
    questionNav.appendChild(button);
  });
}

function renderStats() {
  const questions = state.mode === "review" || state.mode === "random" ? currentQuestions() : currentSet().questions;
  const answered = questions.filter((question) => selectedFor(question).length).length;
  progressText.textContent = `${answered} / ${questions.length}`;
  const ratio = questions.length === 0 ? 0 : Math.round((answered / questions.length) * 100);
  progressFill.style.width = `${ratio}%`;
  renderSidebarSummary();
}

function renderActionHint(questions = currentQuestions()) {
  const activeQuestions = questions.length > 0 ? questions : currentQuestions();
  let message = "";
  if (state.mode === "exam" && !isExamGraded()) {
    const remaining = unansweredCount("exam");
    message = remaining > 0 ? `미응답 ${remaining}문항이 남아 있습니다.` : "모든 문항에 답했습니다. 채점할 수 있습니다.";
  } else if (state.mode === "random" && !isRandomGraded()) {
    const remaining = unansweredCount("random");
    message = remaining > 0 ? `미응답 ${remaining}문항이 남아 있습니다.` : "랜덤 세트 채점 준비가 끝났습니다.";
  } else if (state.mode === "review" && !isExamGraded()) {
    message = "시험 모드에서 채점하면 오답 풀이가 열립니다.";
  } else if (state.mode === "review" && isReviewRetake()) {
    const remaining = activeQuestions.filter((question) => selectedFor(question, "exam").length === 0).length;
    message = remaining > 0 ? `오답 다시풀기 미응답 ${remaining}문항이 남아 있습니다.` : "오답 재채점 준비가 끝났습니다.";
  } else if (!hasWrongNoteItems()) {
    message = "오답 노트는 채점 후 확인할 수 있습니다.";
  }
  actionHint.textContent = message;
}

function allWrongNoteItems() {
  const items = [];
  data.sets.forEach((set) => {
    if (!state.examGraded[set.id]) return;
    set.questions.forEach((question) => {
      const enriched = { ...question, setId: set.id, setTitle: set.title, noteMode: "exam" };
      if (!isCorrect(enriched, "exam")) items.push(enriched);
    });
  });
  if (isRandomGraded()) {
    missedRandomQuestions().forEach((question) => {
      items.push({ ...question, noteMode: "random", setTitle: question.setTitle || "랜덤" });
    });
  }
  return items;
}

function wrongNoteItems(filter = wrongNoteFilter) {
  const items = allWrongNoteItems();
  if (filter === "all") return items;
  if (filter === "random") return items.filter((question) => question.noteMode === "random");
  return items.filter((question) => question.noteMode === "exam" && question.setId === filter);
}

function hasWrongNoteItems() {
  return allWrongNoteItems().length > 0;
}

function openWrongNote() {
  if (!hasWrongNoteItems()) return;
  if (wrongNoteFilter === "all" && wrongNoteItems(state.setId).length > 0) wrongNoteFilter = state.setId;
  if (wrongNoteFilter !== "all" && wrongNoteItems(wrongNoteFilter).length === 0) wrongNoteFilter = "all";
  renderWrongNote();
  wrongNoteModal.hidden = false;
}

function renderWrongNote() {
  wrongNoteBody.replaceChildren();
  const items = wrongNoteItems();

  const filterRow = document.createElement("div");
  filterRow.className = "record-actions";
  const filter = document.createElement("select");
  filter.setAttribute("aria-label", "오답 노트 필터");
  const allOption = document.createElement("option");
  allOption.value = "all";
  allOption.textContent = `전체 오답 (${allWrongNoteItems().length})`;
  filter.appendChild(allOption);
  data.sets.forEach((set) => {
    const count = wrongNoteItems(set.id).length;
    if (count === 0) return;
    const option = document.createElement("option");
    option.value = set.id;
    option.textContent = `${set.title} (${count})`;
    filter.appendChild(option);
  });
  if (wrongNoteItems("random").length > 0) {
    const randomOption = document.createElement("option");
    randomOption.value = "random";
    randomOption.textContent = `랜덤 (${wrongNoteItems("random").length})`;
    filter.appendChild(randomOption);
  }
  filter.value = wrongNoteFilter;
  filter.addEventListener("change", () => {
    wrongNoteFilter = filter.value;
    renderWrongNote();
  });

  const retry = document.createElement("button");
  retry.type = "button";
  retry.textContent = "선택 세트 오답 다시풀기";
  retry.disabled = !data.sets.some((set) => set.id === wrongNoteFilter);
  retry.addEventListener("click", startWrongNoteRetake);
  filterRow.append(filter, retry);
  wrongNoteBody.appendChild(filterRow);

  if (items.length === 0) {
    const empty = document.createElement("p");
    empty.className = "wrong-note-text";
    empty.textContent = "선택한 필터에 해당하는 오답이 없습니다.";
    wrongNoteBody.appendChild(empty);
  } else {
    const list = document.createElement("div");
    list.className = "wrong-note-list";
    items.forEach((question) => {
      const noteMode = question.noteMode || "exam";
      const item = document.createElement("article");
      item.className = "wrong-note-item";
      const meta = document.createElement("span");
      meta.className = "wrong-note-meta";
      const source = question.setTitle ? `${question.setTitle} · ` : "";
      meta.textContent = `${source}문제 ${question.number} · 내 답 ${formatChoice(selectedFor(question, noteMode)) || "-"} · 정답 ${formatChoice(question.answer)}`;
      const text = document.createElement("p");
      text.className = "wrong-note-text";
      text.textContent = stripPdfNoise(question.stem).split("\n")[0];
      const go = document.createElement("button");
      go.type = "button";
      go.textContent = "문제 보기";
      go.addEventListener("click", () => {
        if (noteMode === "random") {
          state.mode = "random";
          setReviewRetake(false);
          renderMode();
        } else if (question.setId && question.setId !== state.setId) {
          state.setId = question.setId;
          state.mode = "review";
          setReviewRetake(false);
          renderExamSelect();
          renderMode();
        }
        const questions = currentQuestions();
        const index = questions.findIndex((item) => (item.setId || state.setId) === (question.setId || state.setId) && item.number === question.number);
        if (index >= 0) state.index = index;
        closeWrongNote();
        render();
      });
      item.append(meta, text, go);
      list.appendChild(item);
    });
    wrongNoteBody.appendChild(list);
  }
}

function closeWrongNote() {
  wrongNoteModal.hidden = true;
  wrongNoteBody.replaceChildren();
}

function startWrongNoteRetake() {
  const set = data.sets.find((item) => item.id === wrongNoteFilter);
  if (!set) return;
  state.setId = set.id;
  state.mode = "review";
  setExamGraded(true);
  const ids = set.questions.filter((question) => !isCorrect({ ...question, setId: set.id }, "exam")).map((question) => question.number);
  state.reviewIds[set.id] = ids;
  ids.forEach((number) => delete state.answers[`${set.id}-exam-${number}`]);
  setReviewRetake(true);
  state.index = 0;
  state.startedAt = Date.now();
  saveAnswers();
  saveUiState();
  renderExamSelect();
  renderMode();
  closeWrongNote();
  render();
}

function shouldShowResults() {
  return (state.mode === "review" && !isReviewRetake()) || (state.mode === "exam" && isExamGraded()) || (state.mode === "random" && isRandomGraded());
}

function shouldShowFeedback(selected) {
  return (
    (state.mode === "review" && !isReviewRetake()) ||
    (state.mode === "exam" && isExamGraded()) ||
    (state.mode === "random" && isRandomGraded()) ||
    (state.mode === "practice" && selected.length > 0)
  );
}

function isAnswerLocked() {
  return (
    (state.mode === "review" && !isReviewRetake()) ||
    (state.mode === "exam" && isExamGraded()) ||
    (state.mode === "random" && isRandomGraded())
  );
}

function chooseOption(question, key) {
  if (isAnswerLocked()) return;
  feedbackExpanded = false;
  const current = new Set(selectedFor(question));
  if (question.answer.length > 1) {
    current.has(key) ? current.delete(key) : current.add(key);
  } else {
    current.clear();
    current.add(key);
  }
  state.answers[answerKey(question)] = [...current];
  saveAnswers();
  saveUiState();
  render();
}

function move(delta) {
  feedbackExpanded = false;
  state.index += delta;
  saveUiState();
  render();
}

function resetCurrentSet(skipConfirm = false) {
  if (!skipConfirm && !window.confirm(`${modeLabel()} 모드의 현재 풀이와 채점 상태를 초기화할까요?`)) return;
  resetAnswersFor(answerMode());
  if (state.mode === "random") {
    generateRandomRefs();
    setRandomGraded(false);
  }
  if (state.mode === "exam" || state.mode === "review") setExamGraded(false);
  if (state.mode === "review") {
    setReviewRetake(false);
    state.reviewIds[state.setId] = [];
  }
  state.startedAt = Date.now();
  saveAnswers();
  saveUiState();
  render();
}

function hasModeProgress(mode = state.mode) {
  const questions = mode === "random" ? randomQuestions() : mode === "review" ? currentQuestions() : currentSet().questions;
  const answerModeForCheck = mode === "review" ? "exam" : mode;
  return questions.some((question) => selectedFor(question, answerModeForCheck).length > 0);
}

function resetModeStart(mode) {
  if (mode === "exam") {
    resetAnswersFor("exam");
    setExamGraded(false);
    setReviewRetake(false);
    state.reviewIds[state.setId] = [];
  }
  if (mode === "practice") {
    resetAnswersFor("practice");
  }
  if (mode === "random") {
    resetAnswersFor("random");
    generateRandomRefs();
    setRandomGraded(false);
  }
  state.startedAt = Date.now();
}

function updateTimer() {
  const seconds = Math.floor((Date.now() - state.startedAt) / 1000);
  const minutes = String(Math.floor(seconds / 60)).padStart(2, "0");
  const remainder = String(seconds % 60).padStart(2, "0");
  timerText.textContent = `${minutes}:${remainder}`;
  mobileTimerBadge.textContent = `시간 ${minutes}:${remainder}`;
}

examSelect.addEventListener("change", () => {
  const nextSetId = examSelect.value;
  if (nextSetId === state.setId) return;
  if (
    hasModeProgress() &&
    !window.confirm("문제 풀이가 진행 중입니다. 문제 세트를 변경하면 현재 모드의 진행 상태가 초기화됩니다. 변경할까요?")
  ) {
    examSelect.value = state.setId;
    return;
  }
  resetModeStart(state.mode);
  state.setId = examSelect.value;
  state.index = 0;
  state.startedAt = Date.now();
  saveUiState();
  render();
});

document.querySelectorAll("[data-mode]").forEach((button) => {
  button.addEventListener("click", () => {
    const nextMode = button.dataset.mode;
    if (nextMode === state.mode) return;
    if (hasModeProgress() && !window.confirm("문제 풀이가 진행 중입니다. 모드를 변경하면 현재 모드의 진행 상태가 초기화됩니다. 변경할까요?")) return;
    resetModeStart(nextMode);
    state.mode = nextMode;
    state.index = 0;
    saveAnswers();
    saveUiState();
    renderMode();
    render();
  });
});

gradeBtn.addEventListener("click", () => {
  if (state.mode === "exam") {
    const remaining = unansweredCount("exam");
    if (remaining > 0 && !window.confirm(`아직 ${remaining}문제를 풀지 않았습니다. 그래도 채점할까요?`)) return;
    setExamGraded(true);
    setReviewRetake(false);
    state.reviewIds[state.setId] = missedExamQuestions().map((question) => question.number);
  }
  if (state.mode === "random") {
    const remaining = unansweredCount("random");
    if (remaining > 0 && !window.confirm(`아직 ${remaining}문제를 풀지 않았습니다. 그래도 채점할까요?`)) return;
    setRandomGraded(true);
  }
  if (state.mode === "review" && isReviewRetake()) {
    const remaining = currentQuestions().filter((question) => selectedFor(question, "exam").length === 0).length;
    if (remaining > 0 && !window.confirm(`오답 재풀이 중 ${remaining}문제가 비어 있습니다. 그래도 재채점할까요?`)) return;
    setReviewRetake(false);
    state.reviewIds[state.setId] = missedExamQuestions().map((question) => question.number);
  }
  saveUiState();
  render();
});

retryWrongBtn.addEventListener("click", () => {
  const missed = missedExamQuestions();
  if (missed.length === 0) return;
  state.reviewIds[state.setId] = missed.map((question) => question.number);
  missed.forEach((question) => delete state.answers[answerKey(question, "exam")]);
  setReviewRetake(true);
  state.index = 0;
  state.startedAt = Date.now();
  saveAnswers();
  saveUiState();
  render();
});

exportBackupBtn.addEventListener("click", exportBackup);

importBackupBtn.addEventListener("click", () => {
  backupFileInput.click();
});

backupFileInput.addEventListener("change", () => {
  const [file] = backupFileInput.files || [];
  importBackup(file).finally(() => {
    backupFileInput.value = "";
  });
});

toggleNavBtn.addEventListener("click", () => {
  state.navCollapsed = !state.navCollapsed;
  saveUiState();
  render();
});

resetAllBtn.addEventListener("click", () => {
  if (!window.confirm("현재 문제 세트의 연습, 시험, 오답 기록을 모두 삭제할까요?")) return;
  resetAnswersFor("practice");
  resetAnswersFor("exam");
  resetAnswersFor("random");
  setExamGraded(false);
  setRandomGraded(false);
  generateRandomRefs();
  setReviewRetake(false);
  state.reviewIds[state.setId] = [];
  state.index = 0;
  state.startedAt = Date.now();
  saveAnswers();
  saveUiState();
  render();
});

resetBtn.addEventListener("click", resetCurrentSet);
prevBtn.addEventListener("click", () => move(-1));
nextBtn.addEventListener("click", () => move(1));
wrongNoteBtn.addEventListener("click", openWrongNote);
sidebarToggleBtn.addEventListener("click", () => {
  state.sidebarCollapsed = !state.sidebarCollapsed;
  saveUiState();
  renderSidebarSummary();
});
figureModalCloseBtn.addEventListener("click", closeFigureModal);
figureModal.addEventListener("click", (event) => {
  if (event.target === figureModal) closeFigureModal();
});
wrongNoteCloseBtn.addEventListener("click", closeWrongNote);
wrongNoteModal.addEventListener("click", (event) => {
  if (event.target === wrongNoteModal) closeWrongNote();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeFigureModal();
    closeWrongNote();
    return;
  }
  if (event.key === "ArrowLeft") move(-1);
  if (event.key === "ArrowRight") move(1);
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    backgroundedAt = Date.now();
    saveAnswers();
    saveUiState();
    return;
  }
  if (document.visibilityState === "visible" && backgroundedAt && Date.now() - backgroundedAt >= 10000 && hasModeProgress()) {
    const shouldReset = window.confirm("앱을 잠시 벗어났습니다. 진행 중인 모드를 초기화할까요?\n\n확인: 초기화\n취소: 이어하기");
    backgroundedAt = 0;
    if (shouldReset) {
      resetCurrentSet(true);
      return;
    }
    render();
  }
});

window.addEventListener("pagehide", () => {
  saveAnswers();
