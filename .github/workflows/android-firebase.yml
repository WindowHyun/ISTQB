# React 웹빌드 → Capacitor sync → APK 빌드 → Firebase App Distribution 업로드
#
# 실행: 저장소 Actions 탭에서 "Run workflow"(수동) 또는 v* 태그 푸시 시.
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_ANDROID_APP_ID        : Firebase 안드로이드 앱 ID (예: 1:1234567890:android:abcdef)
#   FIREBASE_SERVICE_ACCOUNT_JSON  : "Firebase App Distribution Admin" 권한 서비스계정 키(JSON 전체 내용)
#   (선택, release 서명 시)
#   ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#
# 기본은 debug APK를 빌드해 업로드한다(서명 키 불필요, App Distribution 테스터 배포엔 충분).

name: Android → Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "릴리스 노트(테스터에게 표시)"
        required: false
        default: "새 빌드"
      groups:
        description: "배포 대상 테스터 그룹(쉼표 구분)"
        required: false
        default: "WiseStoneT"
  push:
    tags:
      - "v*"

jobs:
  build-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 20은 2026-04 EOL — 현행 LTS(24)로 통일(다른 워크플로와 동일).
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build web (React → dist)
        run: npm run build

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          # Capacitor 7의 capacitor-android가 Java 21을 요구한다(invalid source release: 21 방지).
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Capacitor sync (dist → android)
        run: npx cap sync android

      # ── 서명 ───────────────────────────────────────────────────────────
      # keystore Secret이 있으면 **서명된 release APK**를, 없으면 종전대로 debug APK를
      # 만든다. 두 갈래로 둔 이유는 순서 의존을 없애기 위해서다 — 워크플로를 먼저 고쳐도
      # 빌드가 깨지지 않고, Secret을 등록하는 순간부터 서명 빌드로 넘어간다.
      #
      # 서명이 왜 필요한가: debug APK는 러너가 그때그때 만드는 임시 키로 서명된다.
      # 러너는 실행마다 새로 만들어지므로 **빌드마다 서명이 달라지고**, 안드로이드는 서명이
      # 다른 APK를 기존 앱 위에 덮어쓰지 않는다(INSTALL_FAILED_UPDATE_INCOMPATIBLE).
      # 그래서 테스터는 새 빌드를 받을 때마다 앱을 지웠다 깔아야 했고, 그때마다 풀이
      # 기록(localStorage·IndexedDB)이 함께 사라졌다.
      - name: Detect signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::keystore Secret을 찾았습니다 — 서명된 release APK를 만듭니다."
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::keystore Secret이 없어 debug APK로 배포합니다. 빌드마다 서명이 달라져 테스터는 '삭제 후 설치'를 해야 합니다(docs/firebase-app-distribution.md 참고)."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.have == 'yes'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # 줄바꿈·CR을 먼저 털어낸다 — Windows에서 만든 값은 CRLF로 줄이 접혀 오고,
        # base64는 CR을 입력 오류로 본다. PEM 껍데기(certutil -encode)도 걷어낸다.
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | grep -v -- '-----' \
            | tr -d '\r\n \t' \
            | base64 -d > android/app/release.jks
          test -s android/app/release.jks

      # 비밀번호·alias를 **빌드 전에** 검증한다.
      #
      # 종전에는 값이 틀려도 Gradle이 1분 반을 돌다 packageRelease에서 죽었고, 메시지는
      # "Given final block not properly padded" 한 줄이라 넷 중 무엇이 틀렸는지 알 수 없었다.
      # 여기서 끊으면 어느 Secret을 고칠지가 2초 만에 나온다.
      #
      # keytool CLI가 아니라 작은 Java 프로그램인 이유는 VerifyKeystore.java에 적어 두었다 —
      # 요약하면 keytool은 -keypass가 틀려도 store 비밀번호로 되돌아가 성공해 버린다.
      - name: Verify keystore secrets
        if: steps.signing.outputs.have == 'yes'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # stdout.encoding: 러너 로케일에 따라 한글 메시지가 ?로 깨진다.
        run: >
          java -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
          .github/scripts/VerifyKeystore.java android/app/release.jks

      - name: Build release APK (signed)
        if: steps.signing.outputs.have == 'yes'
        env:
          ISTQB_RELEASE_STORE_FILE: release.jks
          ISTQB_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ISTQB_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ISTQB_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 실행 번호로 versionCode를 올린다 — 고정값이면 테스터 쪽에서 어느 빌드가
          # 최신인지 구분되지 않고, 스토어·배포 도구가 '업데이트'로 취급하지 않는다.
          ISTQB_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Build debug APK (서명 Secret 없음)
        if: steps.signing.outputs.have != 'yes'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Resolve APK path
        id: apk
        run: |
          if [ "${{ steps.signing.outputs.have }}" = "yes" ]; then
            APK=android/app/build/outputs/apk/release/app-release.apk
            NAME=app-release-apk
          else
            APK=android/app/build/outputs/apk/debug/app-debug.apk
            NAME=app-debug-apk
          fi
          # 산출물이 실제로 있는지 여기서 끊는다 — 없으면 업로드 단계가 빈 파일로
          # '성공'하고, 테스터에게 빈 배포가 나간다.
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: ${{ github.event.inputs.groups || 'WiseStoneT' }}
          releaseNotes: ${{ github.event.inputs.notes || github.ref_name }}
          file: ${{ steps.apk.outputs.path }}

      - name: Upload APK artifact (백업)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
