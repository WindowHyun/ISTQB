name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 ref에서 진행 중인 이전 실행을 취소해 중복 실행/분 낭비를 막는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙(읽기 전용).
permissions:
  contents: read

env:
  # npm install 시 Playwright 브라우저 자동 다운로드 차단(브라우저는 e2e 잡에서 명시 설치).
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      # 앱 tsconfig는 테스트를 exclude한다(빌드 대상이 아니므로). 그 결과 테스트와 e2e는
      # 타입 검사를 한 번도 받지 않아, 죽은 비교나 어긋난 fixture가 조용히 통과했다.
      # vitest·playwright는 타입 검사 없이 트랜스파일만 하므로 런타임에서도 안 드러난다.
      - name: Typecheck tests & e2e
        run: npm run typecheck:test

  verify-data:
    name: Verify data & content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate questions & content audits
        run: npm run verify

  # 문제 데이터 ↔ 원본 PDF 정합성(텍스트 2,489조각 · 정답 626문항 · 밑줄 146곳).
  # 스키마 검증(verify)과 달리 '내용'이 원본과 같은지를 PDF에서 독립 추출해 대조한다 —
  # 데이터 수정 커밋이 원문을 훼손하면 여기서 잡힌다.
  pdf-data:
    name: Verify data against source PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pymupdf
        run: pip install pymupdf
      - name: Compare question data with source PDFs
        run: python3 scripts/verify-pdf-data.py

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:cov
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # 살충제 패러독스 대응 계층 — 채점·통계 핵심 유틸에 뮤테이션 테스트를 돌려
  # "테스트가 여전히 결함을 죽이는지"를 검증한다(break 기준은 stryker.config.json).
  mutation:
    name: Mutation tests (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mutation tests
        run: npm run test:mutation
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  # 영속화·상태 계층 전용 뮤테이션(stryker.storage.config.json) — 코어와 분리한 이유는
  # 그 설정 파일의 _comment_split 참고. 요지: 한 설정에 합치면 코어의 높은 기준(break 85)이
  # 평균에 끌려 내려가 answer.ts가 무너져도 통과하게 된다.
  # 실행이 ~11분이라 코어 뮤테이션(~70초)과 한 잡에 묶지 않는다. 다른 잡과 병렬이라
  # 전체 CI 소요(최장 잡 = e2e ~13분)는 늘어나지 않는다.
  mutation-storage:
    name: Mutation tests — 영속화·상태 계층
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mutation tests (storage · store)
        run: npm run test:mutation:storage
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-storage
          path: reports/mutation-storage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check bundle size budget
        run: npm run size
      - name: Upload build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  # 안드로이드 APK 컴파일 검증(배포 없음).
  # 배포 워크플로(android-firebase.yml)는 수동 실행 + 즉시 테스터 배포라, 여기가 없으면
  # 네이티브(MainActivity)·Capacitor 플러그인 변경이 "테스터에게 나가는 순간"에야 깨진다.
  # assembleDebug까지만 하고 Firebase 업로드는 하지 않으므로 시크릿이 필요 없다(PR에서 안전).
  # 다른 잡과 병렬이라 전체 CI 소요(최장 잡 = e2e)에는 영향이 없다.
  android-build:
    name: Android APK build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web (React → dist)
        run: npm run build
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          # Capacitor 7의 capacitor-android가 Java 21을 요구한다(배포 워크플로와 동일).
          distribution: "temurin"
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Capacitor sync (dist → android)
        run: npx cap sync android
      # sync가 만들어내는 gradle 파일이 커밋본과 다르면 배포 시에만 드러나는 표류다 —
      # 플러그인을 추가하고 `cap sync`를 커밋하지 않은 경우를 여기서 잡는다.
      - name: Fail if committed Android project is stale
        run: |
          if ! git diff --quiet -- android/; then
            echo '::error::npx cap sync android 결과가 커밋본과 다릅니다. 아래 diff를 커밋하세요.'
            git diff -- android/
            exit 1
          fi
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

  # timeout 30분인 이유는 "스위트가 30분 걸려서"가 아니라 **최악의 경우가 그 안에 들어오게
  # 하려고**다. 정상 실행은 ~11~13분이고(main #270: 417건 11분 23초), 남은 여유는 CI의
  # `retries: 1`이 한 번 붙는 경우를 위한 것이다.
  #
  # 그래서 지켜야 할 부등식이 하나 있다:
  #
  #     스펙 최대 예산 × 2(재시도) + 정상 스위트 시간  <  이 잡의 timeout
  #     7분 × 2 + 13분 = 27분  <  30분  ✓
  #
  # 이것이 깨져 있으면 무거운 스펙이 한 번 멈출 때 잡이 벽시계로 잘리고, 그때는 Playwright가
  # 리포트를 쓰기 전이라 **원인이 한 줄도 안 남는다**. #256·#257·#266이 정확히 그렇게
  # 잘렸고(정상 12분 / 실패 20:20) 무엇이 걸렸는지 알 수 없었다. 종전에는 스펙 예산이
  # 15~30분이라 부등식이 성립할 수 없었다 — timeout을 20→30분으로 올려도 마찬가지였다.
  # 그래서 timeout이 아니라 **스펙 예산 쪽**을 실측 기반으로 조였다(각 스펙 주석 참고):
  #   react-fullsweep 30분→5분(실측 43초) · react-fullgrade 30분→5분(1.2분)
  #   react-monkey 15분→7분(1.7~2.2분) · react-pairwise 15분→5분(1.1분)
  #   react-transition-quick 15분→5분(46초)
  # 이제 멈춘 스펙은 자기 예산에서 죽으면서 trace·error-context를 남긴다.
  #
  # 스펙 예산을 올릴 일이 생기면 위 부등식을 다시 계산한다.
  # (참고: react-webkit-motion을 이 잡의 근본 비용으로 본 적이 있는데 틀린 진단이었다 —
  #  main은 그 스펙을 포함하고도 11분이었다. 실제 비용은 무거운 스펙의 간헐적 멈춤이다.)
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  nonfunctional:
    name: Non-functional (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      # 성능·부하·메모리·타이머·오프라인·데이터 내구성. 예산은 CI에서 완화(러너 변동성 흡수).
      - name: Run non-functional suite
        run: npm run test:nf
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nf
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # 이 앱이 실제로 배포되는 형태는 APK(Android WebView)다. 그런데 apk/apk-nf 프로젝트는
  # playwright.config.ts에 정의돼 있고 스펙도 18개 있으면서, 어느 워크플로에도 걸려 있지
  # 않아 사람이 손으로 돌릴 때만 실행됐다 — 안전영역·제스처바·터치 타깃 회귀가 자동
  # 게이트 밖에 있었다는 뜻이다. 데스크톱 E2E는 이 축을 대신 잡아주지 못한다(뷰포트를
  # 줄여도 WebView UA·안전영역 변수는 재현되지 않는다).
  apk:
    name: APK/WebView (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      # Pixel 7 프로파일 + WebView UA + 안전영역 주입 모사 — 기능 10 + 비기능 8.
      - name: Run APK suites
        run: npm run test:apk
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-apk
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── 보안(체크리스트 #4) ──────────────────────────────────────────
  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 배포 번들(=사용자에게 나가는 코드)의 취약점만 차단 기준으로 삼는다.
      # dev 툴링(pdfjs·undici 등)은 런타임에 포함되지 않으므로 아래 정보성 단계에서만 보고한다.
      - name: Audit production deps (fail on high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full tree (informational, dev 포함)
        continue-on-error: true
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 전체 커밋 히스토리에서 유출 이력까지 스캔.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # 스캔 결과를 Security 탭에 업로드.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality # XSS·프로토타입 오염·안전하지 않은 DOM 등.
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
