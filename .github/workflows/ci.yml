name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 ref에서 진행 중인 이전 실행을 취소해 중복 실행/분 낭비를 막는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙(읽기 전용).
permissions:
  contents: read

env:
  # npm install 시 Playwright 브라우저 자동 다운로드 차단(브라우저는 e2e 잡에서 명시 설치).
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      # 앱 tsconfig는 테스트를 exclude한다(빌드 대상이 아니므로). 그 결과 테스트와 e2e는
      # 타입 검사를 한 번도 받지 않아, 죽은 비교나 어긋난 fixture가 조용히 통과했다.
      # vitest·playwright는 타입 검사 없이 트랜스파일만 하므로 런타임에서도 안 드러난다.
      - name: Typecheck tests & e2e
        run: npm run typecheck:test

  verify-data:
    name: Verify data & content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate questions & content audits
        run: npm run verify

  # 문제 데이터 ↔ 원본 PDF 정합성(텍스트 2,491조각 · 정답 626문항 · 밑줄 146곳).
  # 스키마 검증(verify)과 달리 '내용'이 원본과 같은지를 PDF에서 독립 추출해 대조한다 —
  # 데이터 수정 커밋이 원문을 훼손하면 여기서 잡힌다.
  pdf-data:
    name: Verify data against source PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pymupdf
        run: pip install pymupdf
      - name: Compare question data with source PDFs
        run: python3 scripts/verify-pdf-data.py

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:cov
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # 살충제 패러독스 대응 계층 — 채점·통계 핵심 유틸에 뮤테이션 테스트를 돌려
  # "테스트가 여전히 결함을 죽이는지"를 검증한다(break 기준은 stryker.config.json).
  mutation:
    name: Mutation tests (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mutation tests
        run: npm run test:mutation
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  # 영속화·상태 계층 전용 뮤테이션(stryker.storage.config.json) — 코어와 분리한 이유는
  # 그 설정 파일의 _comment_split 참고. 요지: 한 설정에 합치면 코어의 높은 기준(break 85)이
  # 평균에 끌려 내려가 answer.ts가 무너져도 통과하게 된다.
  #
  # 경로 필터: 이 잡이 CI 전체의 임계 경로였다(run #300에서 16분 34초, e2e는 11분 22초).
  # 변이 대상(stryker.storage.config.json의 mutate)이 import하는 모듈, 대상에 닿는 테스트와 그
  # 길목 모듈, 설정이 바뀐 경우에만 Stryker를 돌린다 — 범위는 scripts/changed-areas.js가 import
  # 그래프로 계산한다. 잡 자체는 늘 실행돼 초록으로 끝나므로 필수 체크로 걸려 있어도 막히지
  # 않는다. 그래프가 못 보는 드리프트(fs로 읽는 픽스처 등)는 main 야간 실행(daily-e2e.yml의
  # mutation-storage)이 잡는다.
  mutation-storage:
    name: Mutation tests — 영속화·상태 계층
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || '' }}
        run: node scripts/changed-areas.js --base "$BASE" --github-output
      - name: Setup Node
        if: ${{ steps.areas.outputs.mutationStorage == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: ${{ steps.areas.outputs.mutationStorage == 'true' }}
        run: npm ci
      - name: Run mutation tests (storage · store)
        if: ${{ steps.areas.outputs.mutationStorage == 'true' }}
        run: npm run test:mutation:storage
      - name: Skipped — storage layer unchanged
        if: ${{ steps.areas.outputs.mutationStorage != 'true' }}
        run: echo "저장 계층·의존 모듈·설정 변경 없음 — Stryker 생략(main 야간 실행이 담당)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutation report
        if: ${{ !cancelled() && steps.areas.outputs.mutationStorage == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-storage
          path: reports/mutation-storage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check bundle size budget
        run: npm run size
      - name: Upload build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  # 안드로이드 APK 컴파일 검증(배포 없음).
  # 배포 워크플로(android-firebase.yml)는 수동 실행 + 즉시 테스터 배포라, 여기가 없으면
  # 네이티브(MainActivity)·Capacitor 플러그인 변경이 "테스터에게 나가는 순간"에야 깨진다.
  # assembleDebug까지만 하고 Firebase 업로드는 하지 않으므로 시크릿이 필요 없다(PR에서 안전).
  # 다른 잡과 병렬이라 전체 CI 소요(최장 잡 = e2e)에는 영향이 없다.
  android-build:
    name: Android APK build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web (React → dist)
        run: npm run build
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          # Capacitor 7의 capacitor-android가 Java 21을 요구한다(배포 워크플로와 동일).
          distribution: "temurin"
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 액션 기본값은 `tools platform-tools`인데, 구글이 SDK 저장소에서 레거시 `tools`
          # 패키지를 내렸다. sdkmanager가 "Failed to find package 'tools'"로 죽으면서
          # 이 잡이 통째로 실패한다(CI run #298은 통과, #299부터 실패 — 우리 코드 변경과
          # 무관한 업스트림 변화다). 필요한 것은 platform-tools뿐이고, 빌드에 쓰이는
          # platforms·build-tools는 라이선스 동의 후 AGP가 알아서 내려받는다.
          packages: "platform-tools"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Capacitor sync (dist → android)
        run: npx cap sync android
      # sync가 만들어내는 gradle 파일이 커밋본과 다르면 배포 시에만 드러나는 표류다 —
      # 플러그인을 추가하고 `cap sync`를 커밋하지 않은 경우를 여기서 잡는다.
      - name: Fail if committed Android project is stale
        run: |
          if ! git diff --quiet -- android/; then
            echo '::error::npx cap sync android 결과가 커밋본과 다릅니다. 아래 diff를 커밋하세요.'
            git diff -- android/
            exit 1
          fi
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

  # 기능 E2E(react 프로젝트). 탐색형(몽키·전수 스윕·페어와이즈·교차 정합)은 explore 프로젝트로
  # 분리해 아래 e2e-sweep(데이터·렌더 경로가 바뀐 PR만)과 daily-e2e.yml(매일)에서 돈다.
  # 몽키 하나가 이 스위트 워커 시간의 27%를 쓰고 있었다(2026-09-29 로컬 실측).
  #
  # timeout은 예산 부등식으로 정한다: 스펙 최대 test.setTimeout × 2(재시도) + 정상 시간 < timeout.
  # 현재 최대 예산은 react-quick-ux의 400초 → 6.7분 × 2 + 정상 ~8분 ≈ 21분 < 30분.
  # 깨지면 멈춘 스펙이 예산을 태우는 동안 잡이 먼저 잘려 원인이 남지 않는다
  # (경위: docs/decisions/e2e-test-budget.md).
  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # 탐색 E2E(explore 프로젝트) — 필요한 PR에서만 돈다(영역 판정: scripts/changed-areas.js).
  # - sweep: 데이터나 문항을 그리는 경로가 바뀌면 626문항 전수 렌더 스윕·12세트 완주 채점
  #   두 스펙(SWEEP_SPECS)만.
  # - explore: 탐색 스펙이나 E2E 공용 헬퍼가 바뀌면 explore 전체 — 그러지 않으면 몽키·페어와이즈
  #   스펙을 고친 PR이 그 스펙을 한 번도 돌리지 않고 머지되고, 깨진 것은 다음 날 야간에야 드러난다.
  # 잡은 늘 실행돼 초록으로 끝나므로 필수 체크로 걸려 있어도 막히지 않는다. main에서는
  # daily-e2e.yml이 explore 전체를 매일 돌린다.
  # 예산은 explore 전체 기준으로 잡는다(daily-e2e.yml explore 잡과 같은 40분):
  # 스펙 최대 420초(몽키) × 2 + 정상 시간 < 40분.
  e2e-sweep:
    name: E2E sweep (data · render paths)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || '' }}
        run: node scripts/changed-areas.js --base "$BASE" --github-output
      - name: Setup Node
        if: ${{ steps.areas.outputs.sweep == 'true' || steps.areas.outputs.explore == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: ${{ steps.areas.outputs.sweep == 'true' || steps.areas.outputs.explore == 'true' }}
        run: npm ci
      - name: Cache Playwright browsers
        if: ${{ steps.areas.outputs.sweep == 'true' || steps.areas.outputs.explore == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        if: ${{ steps.areas.outputs.sweep == 'true' || steps.areas.outputs.explore == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Run explore (whole project)
        if: ${{ steps.areas.outputs.explore == 'true' }}
        run: npx playwright test --project=explore
      - name: Run full sweep + full grade
        if: ${{ steps.areas.outputs.sweep == 'true' && steps.areas.outputs.explore != 'true' }}
        # 스펙 목록의 정본은 changed-areas.js의 SWEEP_SPECS다 — 로컬 check:changed와 같은 것을 돌린다.
        run: npx playwright test --project=explore $(node -p "require('./scripts/changed-areas.js').SWEEP_SPECS.join(' ')")
      - name: Skipped — data, render paths and explore specs unchanged
        if: ${{ steps.areas.outputs.sweep != 'true' && steps.areas.outputs.explore != 'true' }}
        run: echo "데이터·렌더 경로·탐색 스펙 변경 없음 — 탐색 E2E 생략(main 야간 실행이 담당)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-sweep
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  nonfunctional:
    name: Non-functional (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      # 성능·부하·메모리·타이머·오프라인·데이터 내구성. 예산은 CI에서 완화(러너 변동성 흡수).
      - name: Run non-functional suite
        run: npm run test:nf
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nf
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # 이 앱이 실제로 배포되는 형태는 APK(Android WebView)다. 그런데 apk/apk-nf 프로젝트는
  # playwright.config.ts에 정의돼 있고 스펙도 18개 있으면서, 어느 워크플로에도 걸려 있지
  # 않아 사람이 손으로 돌릴 때만 실행됐다 — 안전영역·제스처바·터치 타깃 회귀가 자동
  # 게이트 밖에 있었다는 뜻이다. 데스크톱 E2E는 이 축을 대신 잡아주지 못한다(뷰포트를
  # 줄여도 WebView UA·안전영역 변수는 재현되지 않는다).
  apk:
    name: APK/WebView (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      # Pixel 7 프로파일 + WebView UA + 안전영역 주입 모사 — 기능 10 + 비기능 8.
      - name: Run APK suites
        run: npm run test:apk
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-apk
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── 보안(체크리스트 #4) ──────────────────────────────────────────
  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 배포 번들(=사용자에게 나가는 코드)의 취약점만 차단 기준으로 삼는다.
      # dev 툴링(pdfjs·undici 등)은 런타임에 포함되지 않으므로 아래 정보성 단계에서만 보고한다.
      - name: Audit production deps (fail on high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full tree (informational, dev 포함)
        continue-on-error: true
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 전체 커밋 히스토리에서 유출 이력까지 스캔.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # 스캔 결과를 Security 탭에 업로드.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality # XSS·프로토타입 오염·안전하지 않은 DOM 등.
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
