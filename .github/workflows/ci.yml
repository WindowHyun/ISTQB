name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 ref에서 진행 중인 이전 실행을 취소해 중복 실행/분 낭비를 막는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 최소 권한 원칙(읽기 전용).
permissions:
  contents: read

env:
  # npm install 시 Playwright 브라우저 자동 다운로드 차단(브라우저는 e2e 잡에서 명시 설치).
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  verify-data:
    name: Verify data & content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate questions & content audits
        run: npm run verify

  # 문제 데이터 ↔ 원본 PDF 정합성(텍스트 2,489조각 · 정답 626문항 · 밑줄 146곳).
  # 스키마 검증(verify)과 달리 '내용'이 원본과 같은지를 PDF에서 독립 추출해 대조한다 —
  # 데이터 수정 커밋이 원문을 훼손하면 여기서 잡힌다.
  pdf-data:
    name: Verify data against source PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pymupdf
        run: pip install pymupdf
      - name: Compare question data with source PDFs
        run: python3 scripts/verify-pdf-data.py

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests with coverage
        run: npm run test:cov
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # 살충제 패러독스 대응 계층 — 채점·통계 핵심 유틸에 뮤테이션 테스트를 돌려
  # "테스트가 여전히 결함을 죽이는지"를 검증한다(break 기준은 stryker.config.json).
  mutation:
    name: Mutation tests (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run mutation tests
        run: npm run test:mutation
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check bundle size budget
        run: npm run size
      - name: Upload build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  nonfunctional:
    name: Non-functional (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      # 성능·부하·메모리·타이머·오프라인·데이터 내구성. 예산은 CI에서 완화(러너 변동성 흡수).
      - name: Run non-functional suite
        run: npm run test:nf
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nf
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── 보안(체크리스트 #4) ──────────────────────────────────────────
  audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 배포 번들(=사용자에게 나가는 코드)의 취약점만 차단 기준으로 삼는다.
      # dev 툴링(pdfjs·undici 등)은 런타임에 포함되지 않으므로 아래 정보성 단계에서만 보고한다.
      - name: Audit production deps (fail on high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit full tree (informational, dev 포함)
        continue-on-error: true
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 전체 커밋 히스토리에서 유출 이력까지 스캔.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # 스캔 결과를 Security 탭에 업로드.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality # XSS·프로토타입 오염·안전하지 않은 DOM 등.
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
