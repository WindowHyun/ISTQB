name: Daily E2E

# 매일 예약 시각에 Playwright 회귀(기능 E2E + 비기능)를 자동 실행한다.
# - schedule: cron 은 UTC 기준. 17 0 * * * = 00:17 UTC = KST 09:17.
#   (정시 :00 은 러너 혼잡으로 지연이 크므로 분을 비워둠)
# - workflow_dispatch: 필요 시 수동 실행.
# 예약 트리거는 기본 브랜치(main)의 이 파일을 기준으로 동작한다.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

# 예약/수동 실행이 서로를 취소하지 않도록 CI 와 별도 그룹을 쓴다.
concurrency:
  group: daily-e2e-${{ github.ref }}
  cancel-in-progress: false

# 기본은 읽기 전용 — 이슈 생성 권한은 notify 잡에만 부여한다(최소 권한).
permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  e2e:
    name: Daily E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-daily
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # 비기능(성능·부하·메모리·타이머·오프라인·데이터 내구성)도 야간에 상시 감시한다 —
  # PR CI에서만 돌면 머지 없이 지나가는 날의 러너/의존성 드리프트를 놓친다.
  nonfunctional:
    name: Daily Non-functional (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      - name: Run non-functional suite
        run: npm run test:nf
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-daily-nf
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # 실패 시 알림: 'daily-e2e-failure' 라벨의 열린 이슈가 있으면 코멘트, 없으면 새로 생성.
  # (매일 새 이슈가 쌓이지 않도록 하나의 추적 이슈를 재사용한다.)
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [e2e, nonfunctional]
    if: ${{ always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      issues: write
    steps:
      - name: Open/append tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'daily-e2e-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = [
              ['기능 E2E', '${{ needs.e2e.result }}'],
              ['비기능', '${{ needs.nonfunctional.result }}'],
            ].filter(([, result]) => result === 'failure').map(([name]) => name).join(', ');
            const body = [
              `🔴 예약 회귀 실행이 실패했습니다. (실패 스위트: ${failed})`,
              ``,
              `- 실행 로그: ${runUrl}`,
              `- 커밋: ${context.sha}`,
              `- 시각(UTC): ${new Date().toISOString()}`,
            ].join('\n');

            // 라벨이 없으면 생성(이미 있으면 무시).
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' });
            }

            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1,
            });

            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: '🔴 Daily E2E 실패 추적',
                labels: [label],
                body: `${body}\n\n> 원인 해결 후 이 이슈를 닫아주세요. 다음 실패 시 새 코멘트가 이 이슈에 추가됩니다.`,
              });
            }
